:"lifestyle_vlogger","tier":"nano <50k","subs":19500,"region":"NZ"},{"i":122,"name":"Lindseyszn","kol":"entertainment_shorts","tier":"micro 50-250k","subs":80100,"region":"US"},{"i":123,"name":"Macs In Motion","kol":"apple_focused","tier":"nano <50k","subs":31500,"region":"US"},{"i":124,"name":"Legit Pick","kol":"pro_reviewer","tier":"nano <50k","subs":39200,"region":"US"},{"i":125,"name":"Vigrant Tech","kol":"tech_news_media","tier":"nano <50k","subs":16100,"region":"US"},{"i":126,"name":"TechSpace","kol":"other","tier":"nano <50k","subs":34200,"region":"PE"},{"i":127,"name":"Wiz Tech & Gaming","kol":"pro_reviewer","tier":"nano <50k","subs":4710,"region":"CA"},{"i":128,"name":"The_info_Guy7","kol":"lifestyle_vlogger","tier":"nano <50k","subs":1240,"region":"IN"},{"i":129,"name":"Michael Brown","kol":"pro_reviewer","tier":"nano <50k","subs":4210,"region":"US"},{"i":130,"name":"ByHumayun","kol":"other","tier":"nano <50k","subs":37,"region":"PK"},{"i":131,"name":"iBuzz","kol":"apple_focused","tier":"nano <50k","subs":136,"region":"undeclared"},{"i":132,"name":"MrRightSpecs","kol":"pro_reviewer","tier":"micro 50-250k","subs":70000,"region":"IN"},{"i":133,"name":"Karrim Omer","kol":"lifestyle_vlogger","tier":"nano <50k","subs":3280,"region":"US"},{"i":134,"name":"The Energy Culture","kol":"commentary_analyst","tier":"micro 50-250k","subs":71000,"region":"RO"},{"i":135,"name":"Brain Tickle TV","kol":"pro_reviewer","tier":"nano <50k","subs":11400,"region":"US"}],"themes":[["hype_purchase_excitement","excitement, anticipation, preorders, upgrade plans"],["fold_animation_ui","fold/unfold animation, transitions, UI polish, smoothness"],["price_affordability","price, cost, regional pricing, affordability"],["android_prior_art","Apple is late / not original because Android shipped it first"],["android_rival_comparison","direct comparison with or loyalty to Samsung, Xiaomi, Oppo, Pixel"],["design_colors_form","colours, shape, corners, size, weight, closed-state look"],["crease_screen_quality","inner-screen crease, finish, pixel quality, screen protectors"],["camera_hardware","cameras, under-display camera, aperture, image quality"],["durability_tests","durability, hinge life, drop/scratch/bend/water tests, teardown"],["software_usability","day-to-day use: ergonomics, left-handed use, keyboard, multitasking, battery, apps"],["apple_brand_leadership","Apple as a company: CEO, executives, trust, marketing spin"],["creator_credibility_critique","video or creator seen as biased, ad-like, sponsored, shilling"]],"quotes":[],"brands":["Samsung","Google Pixel","Xiaomi","Oppo / Honor / Huawei"],"counts":{"videos":178,"creators":136,"comments_en":7712,"modes":{"fast":5873,"full":2275}},"event":"2026-09-09","summaries":{"themes":{"hype_purchase_excitement":{"positive":["Many viewers see the foldable design as a refreshing, major change from routine iPhone updates, and say it impressed them more than expected.","Several commenters plan to buy or upgrade, including owners of older phones, despite the high price, and are eager for reviews and hands-on time.","Some value it as a phone-tablet hybrid, citing document reading and tablet-style use, though one wishes it had Pro-level cameras."],"negative":["Price is the dominant concern; many call the Duo very expensive, though some still plan to buy it or are tempted anyway.","Some commenters feel underwhelmed or disappointed, citing downgrades and a thicker, heavier build than rival foldables.","A few are switching to a standard Pro model or a Samsung foldable instead of preordering the Duo."]},"fold_animation_ui":{"positive":["Many commenters praise the fold and unfold animation as exceptionally smooth, fluid and clean, with a premium, polished feel.","The blur-and-refocus transition between outer and inner screens is seen as clever, creating the impression of seeing through the display.","Several credit Apple's design and animation team and see Apple's software polish as a strength, with some Samsung fans conceding the point."],"negative":["Many see the unfold blur animation as a gimmick or a weak reason to pay a premium, and some say it is just editing or screen mirroring.","Several dislike that the inner screen blurs or dims at partial angles, preferring a fully visible display right away, and want a toggle.","Some noticed lag, dropped frames and failed gestures in demos, questioning how smooth the software really is, with rival foldables also criticized for animation quality."]},"price_affordability":{"positive":["Many commenters expected a higher price from Apple and were pleasantly surprised it launched at about $2,000.","Several note the price is in line with, or slightly below, rival foldables, so it seems standard for the category.","Some say the cost reflects the two-screen design rather than pro features, and expect strong sales despite the price."],"negative":["Many commenters say the starting price of around two thousand dollars is too high for a phone, comparing it to rent, tuition, or a loan.","Regional pricing draws strong complaints: buyers in India, Brazil and Australia say local prices are far higher than the US price after conversion.","Some worry about costly repairs and the value for money, noting a missing camera and that Samsung's foldables or a Pro Max cost less."]},"android_prior_art":{"positive":["Many commenters note that Samsung, Google, Oppo, Microsoft and others released foldables years earlier, and that Apple is catching up on existing technology.","A common defence is that Apple waits to launch until a product is refined, and its polished software and optimisation make being late worthwhile.","Some say Apple's entry brings foldables wider attention and impresses people who dismissed earlier models, and they welcome that Apple acknowledges earlier makers."],"negative":["Many commenters say foldable phones and under-display cameras have existed on Android for years, so Apple's version is not new.","Several criticise Apple fans for treating the features as innovations, and say Apple is copying Samsung and others.","Some add that earlier under-display cameras hurt photo quality and remained visible, and say Apple's animations or execution look weaker."]},"android_rival_comparison":{"positive":["Many self-identified Samsung Fold owners say they are impressed by Apple's first foldable, especially its unfolding animation, screen and feel, while staying loyal to Samsung.","Commenters are pleasantly surprised that Apple's price is close to Samsung's, and they welcome more foldable competition as good for consumers."],"negative":["Some argue Samsung's foldables are better or cheaper, and criticise the Duo's camera cutout, asymmetrical screen and laggy animations, while crediting Apple for innovation unfairly."]},"design_colors_form":{"positive":["Many commenters find the design attractive, including some Samsung foldable users and people who expected to dislike it, and they praise the attention to detail.","Materials and finish draw praise: titanium, no visible crease, and a matte display. The wider unfolded shape is seen as fixing the awkward aspect ratio.","Opinions differ on form: some like the corners, asymmetry and folio case, while others prefer Samsung's look or note the extra weight."],"negative":["Many dislike the closed look: mismatched, asymmetrical corners and a rounded shape seem odd, and some want squarer corners or a different outer screen.","Weight is a concern: commenters say it is heavy, and adding a case would make one-handed use and handling awkward.","Some say the design looks bland or derivative, resembling earlier foldables, a notepad-like slab or old-style phone cases, and seems fragile without protection."]},"crease_screen_quality":{"positive":["Many commenters are impressed that the inner-screen crease looks barely visible or invisible, with some saying it is better than they expected.","The matte, nano-texture inner display is widely praised, and several commenters think it helps hide the crease and reduces fingerprints.","Some commenters accept an under-display inner camera as a fair trade for a clean screen with no cutout or visible dot."],"negative":["Many commenters say the inner-screen crease is still clearly visible in the footage, despite claims that it would be barely noticeable.","Several see the matte or hazy finish as a trade-off: it softens the crease but reduces clarity and brightness, and some dislike it.","Some doubt the crease will hold up over time, and some worry that cases and screen protectors will be difficult to fit."]},"camera_hardware":{"positive":["Several say they rarely use the inner screen for selfies, since video calls need only modest quality and the outer camera handles photos.","Others say camera quality is not a priority for them, as the Duo's cameras are good enough for casual use, though a few wish for Pro-level cameras."],"negative":["Many commenters say under-display cameras already existed on other phones, so Apple's version is seen as late and not a real innovation.","Under-display selfie cameras are widely criticised for worse image quality, and the camera area stays visible instead of blending into the screen.","Some are disappointed by the missing telephoto lens and lack of a full multi-lens setup at this price, and say camera compromises are a dealbreaker."]},"durability_tests":{"positive":["Many commenters are impressed by the IP68 water and dust rating, though some caution that foldables' ratings may not cover the hinge and want real-world testing.","Titanium construction and a reinforced hinge are seen as signs of strong build quality, with several expecting it to outlast rival foldables.","Commenters point out that durability judgments based on the plastic dummy unit are unfair, and they expect tougher results from the real device."],"negative":["Many commenters doubt the foldable's durability, expecting the hinge or inner screen to wear out or break with repeated folding or a single drop.","Concerns also cover the high price and likely costly repairs, limited case options, and whether dust or sand could get into the hinge despite the water-resistance rating."]},"software_usability":{"positive":["Many commenters like having a pocketable tablet-sized screen that merges phone and iPad roles, useful for travel, reading long documents and larger text.","Multitasking and side-by-side apps are a major draw, especially for video and social browsing, with interest in hinge-aware animations and app support.","Ergonomic details are praised, including thumb-friendly menu placement and iPad-like button positions; a left-handed user expects to adapt easily."],"negative":["Left-handed users say the hardware layout, outer screen and fixed dock placement are awkward and poorly suited to them.","Many find the device too heavy, especially with a case, which they say makes one-handed use difficult and brings it close to a tablet.","Commenters see the multitasking as nothing new compared with Android, and doubt developers will use the extra space. They also dislike the limited dock and the missing Face ID, and say the folio case gets in the way of the cameras and quick payments."]},"apple_brand_leadership":{"positive":["Many praise the tight integration of hardware, custom chips, software and the Apple ecosystem as the main reason this foldable could beat rival foldables.","Commenters admire the polished presentation, the folding animation and small playful touches, seeing them as signs of Apple's design care and its earlier brand character.","Several welcome the leadership handover to the new CEO, and some non-Apple users say the launch impressed them despite no plans to switch."],"negative":["Executives are seen as dodging direct questions and using polished, evasive messaging that avoids obvious issues, such as the device resembling a smaller tablet.","Apple is accused of holding back features to save them for later models, and of using marketing language to downplay limitations.","Apple is criticized for presenting familiar ideas like foldables as groundbreaking, with fans seen as too uncritical and the company as less innovative than before."]},"creator_credibility_critique":{"positive":[],"negative":["Many commenters think tech reviewers are paid by Apple or accessory brands, saying the coverage reads as hype and advertising rather than honest opinion.","Several say the creators flip between criticism and praise, or say 'don't buy' while clearly planning to buy, seeing it as attention-seeking or insincere.","Some suggest reviewers get special access or treatment, and say the videos feel like promotion, especially when the product isn't actually available to test."]}},"price":{"regional_price_gap":["Commenters from India, Brazil, Australia, Canada, Mexico, Turkey and Europe say local prices are far above the US headline price.","Many blame the gap on an \"Apple tax\", meaning import duties, local taxes and exchange rates, and they call the markup unreasonable.","Several say the price is out of reach for most people locally, given wages or cheaper alternatives, so some will skip it."],"samsung_fold_comparison":["Many commenters were surprised that Apple's foldable is priced close to Samsung's, and some say it is a fair deal given its extra features.","Others argue Samsung is cheaper in practice, citing pre-order offers, trade-ins, sales and free accessories that Apple is not expected to match.","Several note that flagship foldables all cost around the same high price, so they see the criticism of Apple as inconsistent or both brands as overpriced."],"fair_for_foldables":["Many commenters expected a considerably higher price and were relieved or surprised that Apple didn't charge more.","Commenters say the price matches other foldables, which already sit around the same level, so it feels standard for the category.","Some argue the cost reflects the two-screen foldable design rather than pro features, so it shouldn't be compared with regular iPhones."],"affordability_barrier":["Several say they simply lack the disposable income, or cite cost of living and economic pressure, so they can only watch.","Some would stick with a cheaper phone, wait years, or skip it, saying the price outweighs how much they would use it."],"overpriced_for_tradeoffs":["Many commenters say the roughly $2,000 price is too high when the phone lacks a telephoto lens and has weaker cameras than Pro models.","Switching from Face ID to Touch ID and using an under-display selfie camera are seen as downgrades that don't suit a premium price.","Others worry about an unproven first-generation foldable: durability, costly screen repairs, weight and thickness, and little real benefit over a standard phone."],"vs_pro_and_ipad":["Many see the Duo's premium over the Pro Max as too large, with the gap described as hard to justify for a similar phone.","Commenters often say the price is about what an iPhone plus an iPad or iPad mini would cost, and most think the separate pair is the better value.","A few see merit in one pocketable device, such as for work reference, but most say it is a nice-to-have, not worth the extra money."],"storage_tradein_financing":["Many commenters think the roughly $2,000 starting price is too high for only 256 GB and want a bigger entry storage tier.","The top storage tiers are seen as steeply priced, with a large jump between 1 TB and 2 TB and doubts about who would buy them.","Many expect buyers to rely on carrier deals, trade-ins, leases or installment plans, though some worry about financing caps, debt and fast depreciation."],"cost_jokes":["Many commenters joke that the price is comparable to big expenses like rent, tuition, a car or a loan, or costs a kidney.","Wordplay on the name \"Duo\" suggests buyers pay double, or the cost of two phones, with jokes about a pricier future model.","Others joke that the phone should do extra things for the money, or that it will drain their bank account and wallet."],"general":["Many commenters see the roughly $2,000 starting price as excessive and out of touch, and criticise people for accepting rising electronics prices.","Others say a high price was always expected for Apple's first foldable, and some think buyers will purchase it mainly for status.","Several would wait for a second generation or want extra protection like AppleCare, citing first-generation risks and costly repairs."]}},"pquotes":[],"public":true,"examples":[{"q":"Which channel sizes break out most, and are their audiences happy? Give n.","a":"Small channels break out most: 28 of 74 videos with a baseline (38%) were outperformers, versus 10 of 47 for mid-size channels (21%) and just 2 of 36 for large channels (6%).\n\nAudience mood is mixed everywhere. Mid-size channels are happiest, with 43% positive and 31% negative comments (net +0.13, n=1,842 comments). Small channels are mildly positive at 40% positive and 34% negative (net +0.07, n=2,025). Large channels are basically neutral to slightly negative, at 38% positive and 38% negative (net −0.01, n=1,594).\n\nSo the small channels get the most breakouts with a lukewarm audience, while mid-size channels pair decent breakouts with the best sentiment.\n\nCaveat: the large group has only 36 baseline videos and 2 outperformers, so its rate is shaky. These are associations in a comment sample, not causes.","sql":"WITH v AS (SELECT c.video_id, CASE WHEN cr.tier IN ('nano <50k','micro 50-250k') THEN 'small' WHEN cr.tier='mid 250k-1M' THEN 'mid' WHEN cr.tier IN ('macro 1-5M','mega 5M+') THEN 'large' END AS size_group, p.outperformer FROM content c JOIN creators cr ON cr.channel_id=c.channel_id JOIN performance p ON p.video_id=c.video_id WHERE c.topic='duo' AND c.format!='official'), vp AS (SELECT size_group, COUNT(*) AS n_videos, COUNT(outperformer) AS n_videos_with_baseline, SUM(outperformer) AS n_outperformers, ROUND(AVG(outperformer),3) AS outperformer_rate FROM v GROUP BY size_group), cs AS (SELECT v.size_group, COUNT(*) AS n_product_comments, ROUND(AVG(m.sentiment='positive'),3) AS pct_positive, ROUND(AVG(m.sentiment='negative'),3) AS pct_negative, ROUND(AVG(m.sentiment='positive')-AVG(m.sentiment='negative'),3) AS net_sentiment FROM comments m JOIN v ON v.video_id=m.video_id WHERE m.lang='en' AND m.trivial=0 AND m.target IN ('product','price_value','apple_brand','competitor') GROUP BY v.size_group) SELECT vp.size_group, vp.n_videos, vp.n_videos_with_baseline, vp.n_outperformers, vp.outperformer_rate, cs.n_product_comments, cs.pct_positive, cs.pct_negative, cs.net_sentiment FROM vp LEFT JOIN cs ON cs.size_group=vp.size_group ORDER BY vp.outperformer_rate DESC LIMIT 40"},{"q":"Which content formats work best for mid-sized channels?","a":"First impressions is the only format with a meaningful sample (n=19) and it does fairly well: 37% outperformed their baseline, avg relative lift 2.46, and the most positive sentiment among larger groups (net +0.24). Full review and durability test both show a 100% outperformer rate, but each is n=1, so that's anecdotal. Explainer/tips (n=5) has a high avg lift of 9.98 but only 20% outperformers, suggesting one or two big hits are driving it. Comparison (n=6), upgrade advice (n=8), keynote recap (n=2), meme shorts (n=4) and other (n=2) had zero outperformers. Upgrade advice sentiment was positive (+0.25, n=8) despite lift under 1, while keynote recaps were notably negative (-0.55, n=2). Caveat: these are associations from small samples, not proof a format causes success.","sql":"SELECT c.format, COUNT(*) AS n_videos, SUM(CASE WHEN p.outperformer IS NOT NULL THEN 1 ELSE 0 END) AS n_with_baseline, ROUND(AVG(p.outperformer),3) AS outperformer_rate, ROUND(AVG(p.rel_lift),3) AS avg_rel_lift, SUM(CASE WHEN v.n_product_side>=10 THEN 1 ELSE 0 END) AS n_sent_videos, ROUND(AVG(CASE WHEN v.n_product_side>=10 THEN v.pct_positive - v.pct_negative END),3) AS avg_net_sentiment FROM content c JOIN creators cr ON cr.channel_id=c.channel_id JOIN performance p ON p.video_id=c.video_id JOIN v_content v ON v.video_id=c.video_id WHERE c.topic='duo' AND c.format!='official' AND cr.tier='mid 250k-1M' GROUP BY c.format HAVING n_with_baseline>0 ORDER BY outperformer_rate DESC, avg_rel_lift DESC LIMIT 40"},{"q":"Why are some high-lift videos not ready to scale? Name two examples.","a":"Because their audiences are reacting negatively to the product, even though views are high. Both videos have net sentiment far below the typical +0.048 (across 152 videos).\n\nExample 1: TechDroider's \"iPhone FOLD Hands-On\" (first impressions, macro tier) has lift 86.7 (8.2x relative). Among n=41 product comments, 12% are positive and 71% negative, for net -0.585. The top complaint theme is crease and screen quality.\n\nExample 2: Time Travel Visuals' \"iPhone Duo's Camera Disappears\" (short, mid tier) has lift 496.7 (46.9x relative). Among n=50 product comments, 12% are positive and 68% negative, for net -0.56. The top negative theme is that Android phones did this first.\n\nCaveat: n is modest for both (41 and 50), and the comments are a sample, so treat this as a signal, not proof.","sql":"WITH pc AS (SELECT video_id, COUNT(*) AS n_product, AVG(sentiment='positive') AS pos, AVG(sentiment='negative') AS neg FROM comments WHERE lang='en' AND trivial=0 AND target IN ('product','price_value','apple_brand','competitor') GROUP BY video_id), base AS (SELECT ct.video_id, ct.title, ct.format, cr.name AS creator, cr.tier, p.lift, p.rel_lift, p.outperformer, pc.n_product, pc.pos, pc.neg, pc.pos-pc.neg AS net FROM content ct JOIN creators cr ON cr.channel_id=ct.channel_id JOIN performance p ON p.video_id=ct.video_id JOIN pc ON pc.video_id=ct.video_id WHERE ct.topic='duo' AND ct.format!='official' AND pc.n_product>=10), typ AS (SELECT AVG(net) AS typical_net, COUNT(*) AS n_videos FROM base) SELECT b.creator, b.title, b.format, b.tier, ROUND(b.lift,3) AS lift, ROUND(b.rel_lift,3) AS rel_lift, b.n_product, ROUND(b.pos,3) AS pct_pos, ROUND(b.neg,3) AS pct_neg, ROUND(b.net,3) AS net, ROUND(t.typical_net,3) AS typical_net, t.n_videos, (SELECT th.theme FROM comments c JOIN comment_themes th ON th.comment_id=c.comment_id WHERE c.video_id=b.video_id AND c.lang='en' AND c.trivial=0 AND c.sentiment='negative' AND c.target IN ('product','price_value','apple_brand','competitor') GROUP BY th.theme ORDER BY COUNT(*) DESC LIMIT 1) AS top_negative_theme FROM base b, typ t WHERE b.outperformer=1 AND b.net < t.typical_net-0.05 ORDER BY b.net ASC LIMIT 2"},{"q":"Inside the price discussion, which sub-topics are most negative and which are positive?","a":"Almost every price sub-topic skews negative; only one is clearly positive.\n\nMost negative: regional price gap (n=142, net -0.845, 87% negative), overpriced for the tradeoffs (n=65, net -0.80, 86% negative), and cost jokes (n=61, net -0.754, 87% negative). Affordability barrier (n=81, net -0.654) and comparisons to Pro and iPad (n=33, net -0.576) are also strongly negative. The general bucket (n=190) sits at -0.547.\n\nMilder or positive: storage, trade-in and financing is negative but softer (n=46, net -0.283). The Samsung Fold comparison is roughly split (n=78, net -0.064, 36% positive vs 42% negative). The only clearly positive sub-topic is \"fair for foldables\" (n=68, net +0.662, 72% positive).\n\nCaveat: these are associations in a comment sample, not causes, and the smaller groups (n=33 to 68) are less stable.","sql":"SELECT c.price_sub, COUNT(*) AS n, ROUND(AVG(c.sentiment='positive'),3) AS pct_positive, ROUND(AVG(c.sentiment='neutral'),3) AS pct_neutral, ROUND(AVG(c.sentiment='negative'),3) AS pct_negative, ROUND(AVG(c.sentiment='positive') - AVG(c.sentiment='negative'),3) AS net_sentiment FROM comments c JOIN content v ON v.video_id=c.video_id JOIN comment_themes t ON t.comment_id=c.comment_id AND t.theme='price_affordability' WHERE v.topic='duo' AND v.format!='official' AND c.lang='en' AND c.trivial=0 AND c.target IN ('product','price_value','apple_brand','competitor') AND c.price_sub IS NOT NULL GROUP BY c.price_sub ORDER BY net_sentiment ASC LIMIT 40"},{"q":"How does audience sentiment on the iPhone Duo compare with the iPhone 18 Pro?","a":"The iPhone 18 Pro gets better sentiment than the Duo, though the gap comes from negatives, not positives. Net sentiment is +0.149 for the 18 Pro (n=2,673 comments across 92 videos) versus +0.064 for the Duo (n=5,461 across 167 videos).\n\nPositive share is almost identical: 40.5% for the Duo and 40.3% for the 18 Pro. The difference is that the Duo draws more negative comments (34.1% vs 25.4%) and fewer neutral ones (25.4% vs 34.3%). Duo commenters are more polarized, while 18 Pro comments are more often neutral.\n\nBoth samples are fairly large, so the gap looks real. Still, these are YouTube comments on non-official videos, so they reflect who comments, not all buyers, and the numbers show association, not cause.","sql":"SELECT c.topic, COUNT(*) AS n_product_side, COUNT(DISTINCT c.video_id) AS n_videos, ROUND(AVG(m.sentiment='positive'),3) AS pct_positive, ROUND(AVG(m.sentiment='neutral'),3) AS pct_neutral, ROUND(AVG(m.sentiment='negative'),3) AS pct_negative, ROUND(AVG(m.sentiment='positive')-AVG(m.sentiment='negative'),3) AS net_sentiment FROM comments m JOIN content c ON c.video_id=m.video_id WHERE c.topic IN ('duo','iphone_18_pro') AND c.format!='official' AND m.lang='en' AND m.trivial=0 AND m.target IN ('product','price_value','apple_brand','competitor') GROUP BY c.topic LIMIT 40"},{"q":"What do people like most about the Duo, and what do they criticise most?","a":"Praise centers on excitement and the fold experience; criticism centers on price. Hype and purchase excitement is the most positive theme (n=629, 90% positive, 1.6% negative), though it's about enthusiasm rather than a specific feature. Among product features, the fold animation and UI is the best liked (n=316, 71% positive, 20% negative). Android comparisons are also mostly favorable (n=1,170, 50% positive, 31% negative).\n\nPrice is the biggest complaint (n=764, 65% negative, 17% positive), followed by the idea that Android makers did it first (n=448, 63% negative). Apple brand and leadership comments lean negative too (n=363, 51% negative). Crease/screen quality, camera hardware and durability are mildly negative (n=349 to 431, about 36% to 41% negative).\n\nCaveat: these are associations in a sample of 5,461 product-side comments, not proof of what drives opinions. A comment can also be counted under more than one theme.","sql":"WITH base AS (SELECT c.comment_id, c.sentiment FROM comments c JOIN content v ON v.video_id=c.video_id WHERE v.topic='duo' AND v.format!='official' AND c.lang='en' AND c.trivial=0 AND c.target IN ('product','price_value','apple_brand','competitor')), tot AS (SELECT count(*) AS total FROM base) SELECT t.theme, count(*) AS n, sum(b.sentiment='positive') AS n_pos, sum(b.sentiment='negative') AS n_neg, round(1.0*sum(b.sentiment='positive')/count(*),3) AS pct_pos, round(1.0*sum(b.sentiment='negative')/count(*),3) AS pct_neg, round(1.0*(sum(b.sentiment='positive')-sum(b.sentiment='negative'))/count(*),3) AS net_sent, round(1.0*count(*)/(SELECT total FROM tot),3) AS share_of_product_side, (SELECT total FROM tot) AS total_product_side_n FROM base b JOIN comment_themes t ON t.comment_id=b.comment_id GROUP BY t.theme ORDER BY n_pos DESC LIMIT 40"}]};

const GL={small:"Small channels: under 250k subscribers.",mid:"Mid-size channels: 250k to 1M subscribers.",large:"Large channels: 1M+ subscribers.",
 outperformer:"Views in the top quarter relative to the channel's own usual views, compared within Shorts or within long videos, already adjusted for the launch-week boost.",

 eng:"Likes plus comments on the videos in view.",engrate:"Likes plus comments divided by views, across the videos in view.",views:"Total views on the videos in view.",creators:"Distinct channels with at least one video in view.",vids:"Number of videos in view.",
 sent:METH.ps,n:"Sample size. Groups with fewer than 10 are flagged because their rates can swing a lot.",

 scale:"Scale = outperformer whose audience reaction (positive minus negative) is at least as good as a typical video, within a 5-point tolerance. Needs at least 10 comments about the product.",

const sum=(a,f)=>a.reduce((s,x)=>s+f(x),0),med=a=>{a=a.filter(x=>x!=null).sort((x,y)=>x-y);if(!a.length)return null;const m=a.length>>1;return a.length%2?a[m]:(a[m-1]+a[m])/2};
const pct=(x,d=0)=>x==null?"–":(x*100).toFixed(d)+"%",num=x=>x==null?"–":x>=1e9?(x/1e9).toFixed(1)+"B":x>=1e6?(x/1e6).toFixed(1)+"M":x>=1e3?(x/1e3).toFixed(0)+"k":String(Math.round(x));
const nTag=n=>`<span class="n ${n<10?"low":""}" data-g="n">n=${n.toLocaleString()}${n<10?" low":""}</span>`;

const allOf=k=>k==="kol"?Object.keys(LBL.kol):k==="tier"?TIERS.slice():k==="region"?REGIONS.slice():Object.keys(LBL.f);
function base(over={}){const st=Object.assign({},S,over);return V.filter(v=>SLICE.every(([k,,get])=>st[k].includes(get(v))))}
const nps=v=>v.a.ps[0]+v.a.ps[1]+v.a.ps[2],posOf=v=>nps(v)?v.a.ps[0]/nps(v):null,negOf=v=>nps(v)?v.a.ps[2]/nps(v):null,netOf=v=>nps(v)?(v.a.ps[0]-v.a.ps[2])/nps(v):null;
const MEDNET=med(V.filter(v=>nps(v)>=10).map(netOf)),TOL=0.05,sg=x=>(x>=0?"+":"")+Math.round(x*100)+" pts";
const PCT_=[V.filter(v=>!v.sh&&v.rl!=null).map(v=>v.rl).sort((a,b)=>a-b),V.filter(v=>v.sh&&v.rl!=null).map(v=>v.rl).sort((a,b)=>a-b)];
function PCT(v){const a=PCT_[+!!v.sh];if(v.rl==null)return null;let lo=0,hi=a.length;while(lo<hi){const mid=(lo+hi)>>1;a[mid]<v.rl?lo=mid+1:hi=mid}return lo/Math.max(a.length-1,1)}
function stats(vs){const ev=vs.filter(v=>v.op!=null),k=sum(ev,v=>v.op),u=sum(ev,v=>v.un||0),ps=[0,1,2].map(i=>sum(vs,v=>v.a.ps[i])),np=ps[0]+ps[1]+ps[2],views=sum(vs,v=>v.vw),eng=sum(vs,v=>v.lk+v.cc);
 return{n:vs.length,nev:ev.length,k,u,rate:ev.length?k/ev.length:null,urate:ev.length?u/ev.length:null,views,eng,engrate:views?eng/views:null,ps,np,creators:new Set(vs.map(v=>v.c)).size}}

function sbar(c,method){const n=c[0]+c[1]+c[2];if(!n)return`<span class="faint small">no labelled comments</span>`;
 const tip=`Positive ${pct(c[0]/n)} · Neutral ${pct(c[1]/n)} · Negative ${pct(c[2]/n)} (n=${n.toLocaleString()}). ${method||METH.ps}`;
 return`<div class="sbar" data-tip="${esc(tip)}"><i class="p" style="width:${c[0]/n*100}%"></i><i class="u" style="width:${c[1]/n*100}%"></i><i class="g" style="width:${c[2]/n*100}%"></i></div>`}

/* lift x sentiment: the rule that decides scale vs improve */
function judge(v){const lift=v.op===1?"high":v.un===1?"low":"mid",n=nps(v),pos=posOf(v),neg=negOf(v),net=netOf(v),sent=n<10?"unknown":net>=MEDNET-TOL?"good":"weak";
 const tc=themeCounts(v).filter(x=>x.k!=="creator_credibility_critique"),topG=tc.slice().sort((a,b)=>b.g-a.g)[0],topP=tc.slice().sort((a,b)=>b.p-a.p)[0];
 const cmp=n>=10?`${pct(pos)} positive, ${pct(neg)} negative (net ${sg(net)} vs typical ${sg(MEDNET)})`:"";
 let verdict=null,why="";
 if(lift==="high"&&sent==="good"){verdict="scale";why=`High lift and a positive audience: ${cmp}.${topP&&topP.p>=3?" Praise centres on "+lc(LBL.th[topP.k])+".":""}`}
 else if(lift==="high"&&sent==="weak"){verdict="fix";why=`High lift but the audience is not happy: ${cmp}.${topG&&topG.g>=3?" Complaints centre on "+lc(LBL.th[topG.k])+".":""} Fix the message before scaling.`}
 else if(lift==="high"){verdict="unv";why=`High lift, but ${fewTxt(v)}, so the audience reaction cannot be judged yet.`}
 else if(lift==="low"){verdict="low";why=sent==="good"?`Low lift but a positive audience: ${cmp}. A reach problem: check title, thumbnail and timing.`:sent==="weak"?`Low lift and a weak reaction: ${cmp}.${topG&&topG.g>=3?" Complaints centre on "+lc(LBL.th[topG.k])+".":""}`:`Low lift, and ${fewTxt(v)}, so the audience reaction cannot be judged yet.`}
 return{lift,sent,verdict,why}}

function heat(vs,rowKeys,rowLbl,rowGet,colKeys,colLbl,colGet,rowSlice,colSlice){
