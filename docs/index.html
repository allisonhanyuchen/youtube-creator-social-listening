3tech","kol":"pro_reviewer","tier":"nano <50k","subs":12100,"region":"US"},{"i":141,"name":"Joseph Arning","kol":"entertainment_shorts","tier":"mid 250k-1M","subs":363000,"region":"US"},{"i":142,"name":"ByHumayun","kol":"other","tier":"nano <50k","subs":37,"region":"PK"},{"i":143,"name":"iBuzz","kol":"apple_focused","tier":"nano <50k","subs":137,"region":"undeclared"},{"i":144,"name":"Fun land","kol":"entertainment_shorts","tier":"micro 50-250k","subs":125000,"region":"undeclared"},{"i":145,"name":"MrRightSpecs","kol":"pro_reviewer","tier":"micro 50-250k","subs":70000,"region":"IN"},{"i":146,"name":"Karrim Omer","kol":"lifestyle_vlogger","tier":"nano <50k","subs":3280,"region":"US"},{"i":147,"name":"The Energy Culture","kol":"commentary_analyst","tier":"micro 50-250k","subs":71100,"region":"RO"},{"i":148,"name":"iGageit","kol":"lifestyle_vlogger","tier":"nano <50k","subs":39800,"region":"US"},{"i":149,"name":"Brain Tickle TV","kol":"pro_reviewer","tier":"nano <50k","subs":11400,"region":"US"}],"quotes":[],"brands":["Samsung","Google Pixel","Xiaomi","Oppo / Honor / Huawei"],"counts":{"videos":200,"creators":150,"comments_en":9184,"as_of":"2026-10-04","assigned":0.846,"modes":{"fast":7480,"full":2275}},"event":"2026-09-09","product":{"name":"iPhone Duo","brand":"Apple"},"summaries":{"topics":{"p01":{"positive":["Many commenters praise the opening and closing animation as smooth, clean and clever, including some who say they usually prefer other brands.","Viewers see the matte inner screen as a smart way to hide the crease, and some say no crease is visible.","Some note the animation reacts to the hinge angle, suggesting developers could build new effects, and it is seen as typical of Apple's attention to detail."],"negative":["Several viewers see the fold animation as a superficial gimmick, noting that a fan has already recreated it on a rival foldable.","Commenters criticise the high price, especially outside the US, and compare it unfavourably with cheaper rival foldables and worry about repair costs."]},"p02":{"positive":["Several commenters credit Samsung for pioneering foldables and supplying the screen, while saying they are happy to stay with their Fold.","Some see Apple's entry as good for the market, expecting rivals to respond and the category to grow, with a few now interested in buying a foldable."],"negative":["Commenters say Samsung and other Android makers released foldable phones many years ago, so Apple's version looks late and unoriginal.","Many mock Apple fans for getting excited about features that Android users have had for years, and say Apple is simply copying Samsung.","Some point out that Apple once dismissed foldables, and that Samsung supplies Apple's screens. A few predict Apple will drop the product soon."]},"p03":{"positive":["Many commenters were pleasantly surprised by the iPhone Duo's design, praising its minimal crease, matte inner screen, unfolding animation and the aspect ratio when open.","Several Samsung Fold 8 owners and fans said they prefer Samsung's squarer, rectangular, thin and light design, though some welcomed Apple to foldables.","Some Apple fans plan to buy the Duo for its software, ecosystem and durability, and say the missing telephoto lens and Touch ID don't bother them."],"negative":["Many commenters say Apple is arriving years after Samsung and Google with foldables, yet presents the idea as new and groundbreaking.","Price draws criticism: commenters say the cost matches an iPhone plus an iPad, so expectations are high and value is questioned.","The outer screen shape, aspect ratio and uneven rounded corners are called awkward or impractical, with some disliking the matte display; some say Samsung's front screen and desktop features are better."]},"p04":{"positive":["Many commenters expected a higher price for Apple's foldable and were pleasantly surprised it launched lower than predicted.","Several note the price is in line with Samsung's foldables and typical for the category, seeing it as competitive or fair.","Some argue the cost is reasonable when compared with early foldables and inflation, or say the larger screen and Apple ecosystem justify it."],"negative":["Many commenters see the foldable's price as excessive, saying it costs about as much as two regular phones and that a phone this expensive should not be normal.","Commenters in India, Mexico, Australia and Europe say local prices are especially steep compared with local incomes and with rival foldables, putting the phone out of reach for most people.","Some say the high cost is not worth it for them personally, whether because they cannot afford it or do not want a foldable."]},"p05":{"positive":["Many commenters prefer an uninterrupted inner screen without a cutout or dot, and say they would trade selfie quality on that display for it.","Several say they rarely use the inner display for selfies, since the outer screen camera is better and easier for photos, or they don't care much about cameras.","Some praise the polished camera animation and open/close transitions, and think the feature will push other brands to improve under-display cameras."],"negative":["Many commenters say under-display cameras aren't new, citing earlier phones, particularly Samsung's, so they don't see this as an Apple innovation.","Several note the camera is still noticeable on the inner screen, so it isn't truly hidden, and some find it looks unappealing."]},"p06":{"positive":["Some hope for a software option to move the dock or controls to the left, or note the device could be rotated."],"negative":["Many left-handed commenters say the Duo's interface and layout are built around right-handed one-handed use, making it awkward or frustrating for them.","Several note this goes beyond software: the fingerprint sensor, outer display, cameras and a right-shifted dock are placed for right-handers, so a mirrored design or setting would be needed.","Some ask for a handedness option or say they'll skip the phone, while a few say left-handers can adapt or have other reasons not to buy."]},"p07":{"positive":["Apple Pencil compatibility on the foldable was a pleasant surprise and a deciding factor for several viewers, who said it pushed them to preorder or switch.","Some Samsung foldable owners see pencil support as an advantage over their own device, and hope stylus support returns to Samsung's folds.","Pencil support is valued alongside other features like water resistance and the larger inner screen, which viewers see as useful for productivity and a mini-tablet style of use."],"negative":["Many commenters say Apple is copying Samsung and other rivals, and has stopped innovating, so praise from Apple fans seems undeserved.","Several see Apple's lack of full Apple Pencil support as a letdown, noting that missing pressure sensitivity limits drawing on the go."]},"p08":{"positive":["Many commenters praise the fold and unfold transition animation, calling it smooth, clean and like looking through glass to the inner screen.","The nano-texture inner display is liked for its matte look, reduced fingerprints and for helping hide the fold crease.","Some see the foldable as a compelling mix of iPhone and small tablet, citing durability, pencil support and flexible screen layouts."],"negative":["Many commenters say the nano-texture (matte) finish lowers clarity, vibrancy and brightness, and some think it is worse in sunlight than a glossy screen.","Some prefer a glossy inner display, accepting a slight crease over a matte finish, and find the glossy-to-matte change between outer and inner screens odd.","Commenters also worry about the inner screen's durability, since it cannot take a screen protector, and doubt the crease reduction is worth the trade-off."]},"p09":{"positive":["Many commenters say they are excited and ready to preorder, with some counting down to launch and already lining up accessories.","Owners of older iPhones, who had held off upgrading for years, see the Duo as a compelling reason to finally switch."],"negative":["Many like the idea but find the price too high, especially compared with the Pro Max, and some say regional pricing is worse.","Several plan to wait for a second or later generation, expecting fixes to first-version problems such as weak cameras, screen durability and weight.","Some think it is too heavy or too similar to an iPad mini, so they would stick with a Pro Max or a tablet."]},"p10":{"positive":["Several commenters like the official folio case, saying it looks good, protects the front screen from smudges and scratches, and even converts them from going caseless.","Many are drawn to the Duo overall, citing smooth fold animations, a barely visible crease, MagSafe and Touch ID, though price gives some pause."],"negative":["Folio and kickstand cases are seen as clumsy: the cover blocks the camera, slows quick payments, and adds too many flaps.","Many worry about protecting such an expensive foldable, especially the outer screen and edges, since bumper-style cases seem hard to fit.","A case adds to what is already a thick, heavy, bulky device, and some doubt it would stop the wobble."]},"p11":{"positive":["Many commenters expect a well-known durability YouTuber to put the phone through bend and break tests, and joke or speculate about how it will hold up.","Some think Apple designed the phone, including reinforced antenna lines, with that kind of testing in mind and expect it to survive.","Reactions are mixed on first-generation risk: some are excited to buy and test it themselves, while others prefer to wait or stay with their current model."],"negative":["Commenters worry the phone is fragile and could break from a single drop, with some pointing to the antenna line as a structural weak point.","Some criticise the high price given that durability appears untested, and note the screen scratches at fairly low levels of the scratch test."]},"p12":{"positive":["Night Sky, the dark blue-black shade, is the most popular color choice, praised as clean, understated and attractive.","Several commenters are torn between Night Sky and white, with white or silver seen as a classic Apple look.","Higher storage tiers are favored by those who mention capacity, and some plan to pair their phone with a taupe folio case."],"negative":["Many commenters worry about battery life and drain, and dislike that Apple doesn't disclose battery capacity or show a percentage in the battery icon.","Storage tiers are seen as very expensive in Australia and New Zealand, with local prices well above currency-converted US prices.","Colour options and names draw criticism: people want plain black or white, and some notice colour inaccuracy on the inner display and visible screen creases."]},"p13":{"positive":["Many like the compact folded size, seeing it as a replacement for small phones like the mini while still offering a large unfolded screen.","Commenters are excited about a genuinely new iPhone design, and some see the foldable as able to replace a tablet.","The software is praised for fitting the folding shape, including smooth open/close animations, screen switching, and a side toolbar that saves vertical space."],"negative":["Size and pocketability are a worry: some say the device is too bulky or wide to carry or hold comfortably, and would rather get a tablet.","Some dislike design choices, such as a covered or awkward front screen, durability concerns about folding screens, and a high price for the use case."]},"p14":{"positive":["Animations and transitions when folding and unfolding get particular praise, with some seeing them as a high bar for foldable software design.","Some say the software alone makes them consider switching or buying, while others note rivals offer more functionality and flexibility."],"negative":["Many commenters mock the idea that Apple is innovating, noting that Samsung and others already made foldables, with Apple mainly adding its own software.","Some see the device as largely Samsung-built hardware with locked-down iOS on top, so Apple's contribution is the software tuning for a folding screen.","Others say software polish may not offset hardware and design drawbacks, and note missing options, such as a feature that can't be toggled."]},"p15":{"positive":["Many commenters say they plan to buy or pre-order the iPhone Duo, and some Android users express admiration or say they switched.","Viewers praise the software, especially the fold transition animations, and say Apple's performance and optimisation beat rival foldables."],"negative":["Many commenters mock the name 'Duo' and wish Apple had chosen something else, such as 'Fold', and they compare it to Microsoft's Surface Duo.","Commenters joke that Apple makes minor tweaks, such as a less visible crease, and presents them as innovation. They also say Samsung supplies much of the hardware.","Others criticize the phone as heavy, chunky and awkward to use one-handed, with a very high price, especially for the top storage tier."]},"p16":{"positive":["Commenters defend the price and build, noting other foldables cost similarly and that durability worries stem from a plastic dummy unit, not the titanium retail phone.","Many are excited by the smooth fold animation and the pocketable tablet-like form, seeing it as useful for travel and for replacing multiple devices.","Several Apple users say they finally want a foldable because it keeps iOS and the ecosystem, and expect competitors and app developers to respond."],"negative":["Many commenters worry the folding hinge and crease will wear out over time, and that one drop could ruin an exposed device.","Commenters think the roughly $2,000 starting price is unjustified, especially given the economy, and call the base storage too low.","Several say Apple is copying Samsung and others who already sell foldables, so they don't see it as an innovation."]},"p17":{"positive":["Many praise the design and attention to detail, including the smooth opening animation, the camera bump layout and how well the software suits the hardware.","Several see practical benefits of the wider, book-style form, such as reading documents or patient charts on the move and using it vertically.","Some commenters compare it with foldables from other brands, praising the screen, the ecosystem or other models, while others expect later versions to be better."],"negative":["Several worry about first-generation risks and durability, including repair costs for the screen, hinge stress from drops, and a crease that is more visible than claimed.","Practical design complaints include a wide body that fits pockets poorly, hinge placement, the matte finish hurting video contrast, rounded corners, and the awkward case when using both cameras."]},"p18":{"positive":["Many commenters see the foldable as a pocketable stand-in for an iPad or iPad mini, so they could carry one device instead of two.","The larger inner screen is valued for video, gaming, multitasking, reading and viewing plans or manuals, including for people with weaker eyesight.","Design details get praise: the matte screen, the wide passport-like shape for video, sensible button placement and the smooth screen animation."],"negative":["Many see the foldable as essentially a small iPad in disguise, with little real innovation and arriving years after rival foldables.","Hardware and software drawbacks draw criticism: a matte inner screen that looks poor in sunlight, a crowded home screen, limited dock, and restricted multitasking such as no split apps in landscape.","Concerns about high price, impractical size when folded, difficult cases and repairs, and a wish for reliability fixes over new form factors."]},"p19":{"positive":["Many commenters praise the redesigned iOS for the foldable, saying it looks polished, is well integrated, and adds real multitasking capability beyond the folding form.","Thoughtful details get credit, such as moving interface elements for the wider display so existing apps fit, and layout choices that suit left-handed users.","Some Android users say they would switch or want iOS on a foldable, preferring its simplicity and feel even over arguably stronger Android foldables."],"negative":["Many commenters say the price is excessive, especially outside the US, where taxes and conversion push it to several times the US figure.","Several say the multitasking and split-screen features are nothing new, since Android phones and foldables have offered them for years, and that iOS still looks less mature.","Commenters criticise the design and build, citing a visible crease, a clumsy opening mechanism and awkward use for calls, and doubt the presentation is honest."]},"p20":{"positive":["Commenters praise the hinge as well-engineered, with a durable titanium build that feels more substantial than other foldables or mock-ups.","Some note that water-resistance ratings on foldables usually exclude the hinge, and say brands are not always upfront about this.","The rounded edge and folded look get positive reactions, with people finding it softer, easier to hold and pocket-friendly, and a case that covers the hinge is seen as useful."],"negative":["Commenters doubt that an IP68 rating means much on a foldable, since the hinge area stays open to dust and sand.","Several say dust ingress has already been seen in other IP68 foldables, so they expect the same here despite the rating.","Some worry about long-term hinge durability from repeated folding, and say they would not take a pricey foldable to the beach without protection."]},"p21":{"positive":["Many commenters are excited about the foldable and plan to buy early, either at launch or within the next year.","Viewers praise the barely visible crease, the refined design and the Apple ecosystem, saying it improves on other foldables."],"negative":["Many commenters say Apple is years behind rivals that already sell foldables, so the device feels derivative rather than innovative.","Commenters suspect Apple is deliberately leaving out features, such as the flagship camera, to sell them in next year's model. Some are already waiting for the next version.","The high price and costly extras like insurance are criticised, and many doubt a foldable is useful when a tablet or laptop is at hand."]},"p22":{"positive":["Many viewers like the Duo and would buy it, but wish it had the camera system from the Pro models.","Some Pro owners would keep their current phone or pair it with a Duo, or wait for a later generation."],"negative":["Pricing is a major complaint, with high local prices in several countries seen as unjustified and likely to hurt sales.","Other missing features, such as Face ID, a better battery, speakers and a quick action button, add to the reluctance, so some will wait for a later or Pro version."]}}},"runs":[{"started":"2026-10-04T22:58:39+00:00","finished":"2026-10-04T23:04:39+00:00","mode":"weekly","ok":true,"source":"local","new_videos":22,"new_comments":1472,"new_topics":["Waiting for Next Year","Wanting Pro Cameras"],"alerts":5,"email":false,"slack":false,"slack_alerts":false,"steps":[{"name":"collect new videos, refresh stats","status":"ok","secs":10},{"name":"classify new videos","status":"ok","secs":14},{"name":"channel baselines and lift","status":"ok","secs":34},{"name":"creator types","status":"ok","secs":10},{"name":"pull and label new comments","status":"ok","secs":59},{"name":"build tables","status":"ok","secs":0},{"name":"assign comments to topics, discover new ones","status":"ok","secs":9},{"name":"insights, changes and alerts","status":"ok","secs":25},{"name":"paraphrased topic notes","status":"ok","secs":114},{"name":"recorded Q&A examples","status":"ok","secs":81},{"name":"public demo page","status":"ok","secs":4}]}],"email":"<!doctype html><html><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\"><title>YouTube Creator Social Listening<\/title><\/head><body f topic comments · <b>new<\/b><\/div><\/td><td style=\"padding:6px 8px;border-top:1px solid #e3e3dd\"><table role=\"presentation\" cellpadding=\"0\" cellspacing=\"0\" style=\"width:180px\"><tr><td style=\"width:57px;height:8px;background:#2f8f5b;font-size:0;line-height:0\">&nbsp;<\/td><td style=\"width:63px;height:8px;background:#c4c4bb;font-size:0;line-height:0\">&nbsp;<\/td><td style=\"height:8px;background:#d0553f;font-size:0;line-height:0\">&nbsp;<\/td><\/tr><\/table><\/td><td style=\"border-top:1px solid #e3e3dd;font:12px Arial,sans-serif;color:#66665f\">31% pos · 34% neg<\/td><\/tr><tr><td style=\"padding:6px 0;border-top:1px solid #e3e3dd;font:13px Arial,sans-serif;width:210px\"><b>Apple Pencil Support<\/b><div style=\"color:#66665f;font-size:11px\">n=262 · 5% of topic comments<\/div><\/td><td style=\"padding:6px 8px;border-top:1px solid #e3e3dd\"><table role=\"presentation\" cellpadding=\"0\" cellspacing=\"0\" style=\"width:180px\"><tr><td style=\"width:60px;height:8px;background:#2f8f5b;font-size:0;line-height:0\">&nbsp;<\/td><td style=\"width:54px;height:8px;background:#c4c4bb;font-size:0;line-height:0\">&nbsp;<\/td><td style=\"height:8px;background:#d0553f;font-size:0;line-height:0\">&nbsp;<\/td><\/tr><\/table><\/td><td style=\"border-top:1px solid #e3e3dd;font:12px Arial,sans-serif;color:#66665f\">34% pos · 37% neg<\/td><\/tr><tr><td style=\"padding:6px 0;border-top:1px solid #e3e3dd;font:13px Arial,sans-serif;width:210px\"><b>Crease and Fold Animation<\/b><div style=\"color:#66665f;font-size:11px\">n=254 · 5% of topic comments<\/div><\/td><td style=\"padding:6px 8px;border-top:1px solid #e3e3dd\"><table role=\"presentation\" cellpadding=\"0\" cellspacing=\"0\" style=\"width:180px\"><tr><td style=\"width:84px;height:8px;background:#2f8f5b;font-size:0;line-height:0\">&nbsp;<\/td><td style=\"width:28px;height:8px;background:#c4c4bb;font-size:0;line-height:0\">&nbsp;<\/td><td style=\"height:8px;background:#d0553f;font-size:0;line-height:0\">&nbsp;<\/td><\/tr><\/table><\/td><td style=\"border-top:1px solid #e3e3dd;font:12px Arial,sans-serif;color:#66665f\">46% pos · 38% neg<\/td><\/tr><\/table><div style=\"font:12px Arial,sans-serif;color:#66665f;padding-top:4px\"><span style=\"color:#2f8f5b\">&#9632;<\/span> positive <span style=\"color:#c4c4bb\">&#9632;<\/span> neutral <span style=\"color:#d0553f\">&#9632;<\/span> negative. Topics come from local clustering of comments, named by AI; <b>new<\/b> means found after the first run.<\/div><\/td><\/tr>\n<tr><td style=\"padding:22px 28px 6px;font:600 12px Arial,sans-serif;letter-spacing:.06em;text-transform:uppercase;color:#66665f\">Highlights<\/td><\/tr><tr><td style=\"padding:10px 28px 0\"><div style=\"font:600 15px Arial,sans-serif;color:#1d1d1b\">1. Lift is concentrated in small channels<\/div><div style=\"font:14px/1.5 Arial,sans-serif;color:#1d1d1b;padding-top:2px\">Outperformer rate: small channels 37.3% (99 videos), mid 20.4% (50), large 5.3% (51). Sentiment runs separately: large channels are 37.4% positive vs 38.1% negative; mid are 43.6% vs 30.4%.<\/div><div style=\"font:13px/1.5 Arial,sans-serif;color:#2f5bea;padding-top:3px\"><b>Do next:<\/b> Brief more small and mid creators next week; judge large-channel videos against their own baselines, and report lift and sentiment in separate columns.<\/div><\/td><\/tr><tr><td style=\"padding:10px 28px 0\"><div style=\"font:600 15px Arial,sans-serif;color:#1d1d1b\">2. First impressions and comparisons lead on lift<\/div><div style=\"font:14px/1.5 Arial,sans-serif;color:#1d1d1b;padding-top:2px\">Outperformer rate is 30.6% for first impressions (54 videos) and 30.0% for comparisons (57). Sentiment differs: 45.4% pos/28.6% neg vs 39.9%/37.1%. Meme shorts: 7.7% outperformers, 25.4% pos/44.6% neg (17 videos).<\/div><div style=\"font:13px/1.5 Arial,sans-serif;color:#2f5bea;padding-top:3px\"><b>Do next:<\/b> Commission first-impression and comparison briefs next week; tag meme shorts separately so their low lift and negative tone are read apart.<\/div><\/td><\/tr><tr><td style=\"padding:10px 28px 0\"><div style=\"font:600 15px Arial,sans-serif;color:#1d1d1b\">3. Lifestyle vloggers show high lift and warmer tone<\/div><div style=\"font:14px/1.5 Arial,sans-serif;color:#1d1d1b;padding-top:2px\">Lifestyle vloggers: 39.1% outperformers (26 videos), 48.3% pos/29.3% neg. 'Other' shows 50.0% but has only 11 videos and 171 comments. Entertainment shorts: 19.0%, 26.2% pos/41.6% neg.<\/div><div style=\"font:13px/1.5 Arial,sans-serif;color:#2f5bea;padding-top:3px\"><b>Do next:<\/b> Pilot lifestyle-vlogger briefs; keep the 'other' group out of conclusions until more videos and comments accumulate.<\/div><\/td><\/tr><tr><td style=\"padding:10px 28px 0\"><div style=\"font:600 15px Arial,sans-serif;color:#1d1d1b\">4. Audience topics: Samsung framing dominates, intent is mixed<\/div><div style=\"font:14px/1.5 Arial,sans-serif;color:#1d1d1b;padding-top:2px\">Samsung Did It First is the largest topic (12.5% share, 40.8% pos/37.8% neg, trend 0.98x). Eager to Buy is rising (1.36x, 47.0% pos). Intent: 747 buy, 531 skip, 332 upgrade-wait, 109 switch from Android.<\/div><div style=\"font:13px/1.5 Arial,sans-serif;color:#2f5bea;padding-top:3px\"><b>Do next:<\/b> Ask creators to address the Samsung-first claim directly, and log buy versus skip intent counts weekly to track the balance.<\/div><\/td><\/tr>\n<tr><td style=\"padding:14px 28px 0;font:600 13px Arial,sans-serif;color:#1d1d1b\">Highest-lift videos<\/td><\/tr><tr><td style=\"padding:0 28px\"><table role=\"presentation\" width=\"100%\" cellpadding=\"0\" cellspacing=\"0\"><tr><td style=\"padding:6px 0;border-top:1px solid #e3e3dd;font:13px Arial,sans-serif\"><a href=\"https://www.youtube.com/watch?v=3uiHvZwG8Vg\" style=\"color:#2f5bea;text-decoration:none\">Why we are waiting to launch Limitless for the iPhone Duo<\/a><br><span style=\"color:#66665f;font-size:12px\">Mous · small (<250k) · Other · 80.8x lift · 5919k views · 36% positive, 12% negative<\/span><\/td><\/tr><tr><td style=\"padding:6px 0;border-top:1px solid #e3e3dd;font:13px Arial,sans-serif\"><a href=\"https://www.youtube.com/watch?v=7Ws9Aj3iYFk\" style=\"color:#2f5bea;text-decoration:none\">Apple Iphone duo unboxing and review , #iphoneduo #iphonefold<\/a><br><span style=\"color:#66665f;font-size:12px\">Addii Roots · small (<250k) · Full review · 71.3x lift · 1423k views · 29% positive, 45% negative<\/span><\/td><\/tr><tr><td style=\"padding:6px 0;border-top:1px solid #e3e3dd;font:13px Arial,sans-serif\"><a href=\"https://www.youtube.com/watch?v=qMOZBcfpEF4\" style=\"color:#2f5bea;text-decoration:none\">iPhone Duo’s Camera Disappears #shorts<\/a><br><span style=\"color:#66665f;font-size:12px\">Time Travel Visuals · mid (250k-1M) · Explainer / tips · 67.7x lift · 20445k views · 11% positive, 69% negative<\/span><\/td><\/tr><tr><td style=\"padding:6px 0;border-top:1px solid #e3e3dd;font:13px Arial,sans-serif\"><a href=\"https://www.youtube.com/watch?v=b_-JgVv9PeE\" style=\"color:#2f5bea;text-decoration:none\">I phone fold duo booking 😊॥#Senakesitare<\/a><br><span style=\"color:#66665f;font-size:12px\">JORDI TOKERSSS · small (<250k) · Meme / reaction · 59.8x lift · 5390k views · too few comments for sentiment<\/span><\/td><\/tr><tr><td style=\"padding:6px 0;border-top:1px solid #e3e3dd;font:13px Arial,sans-serif\"><a href=\"https://www.youtube.com/watch?v=64fzFYYdB7s\" style=\"color:#2f5bea;text-decoration:none\">#iPhoneDuo VS #SamsungZFold8 - The Final Showdown! #iphonefold #samsungfold8 #fo<\/a><br><span style=\"color:#66665f;font-size:12px\">Shawn Shaman · small (<250k) · Comparison · 40.8x lift · 457k views · 58% positive, 26% negative<\/span><\/td><\/tr><\/table><\/td><\/tr>\n<tr><td style=\"padding:22px 28px 6px;font:600 12px Arial,sans-serif;letter-spacing:.06em;text-transform:uppercase;color:#66665f\">Changes since last refresh<\/td><\/tr><tr><td style=\"padding:0 28px;font:13px/1.5 Arial,sans-serif;color:#1d1d1b\"><div style=\"padding:3px 0\">22 new videos and 1,472 new comments since 2026-10-04.<\/div><div style=\"padding:3px 0\">Product sentiment: -0.1 pts positive, -0.6 pts negative.<\/div><div style=\"padding:3px 0\">New topic: <b>Waiting for Next Year<\/b> (149 comments).<\/div><div style=\"padding:3px 0\">New topic: <b>Wanting Pro Cameras<\/b> (103 comments).<\/div><div style=\"padding:3px 0\">Samsung Did It First: +71 comments, negative share -0 pts.<\/div><div style=\"padding:3px 0\">Eager to Buy: +113 comments, negative share -1 pts.<\/div><div style=\"padding:3px 0\">Folding Phone Durability Doubts: +54 comments, negative share +0 pts.<\/div><div style=\"padding:3px 0\">Samsung Fold Comparisons: +61 comments, negative share -2 pts.<\/div><div style=\"padding:3px 0\">Name Jokes: +47 comments, negative share -3 pts.<\/div><div style=\"padding:3px 0\">Price Complaints: +35 comments, negative share +1 pts.<\/div><\/td><\/tr>\n<tr><td style=\"padding:10px 28px 0\"><table role=\"presentation\" width=\"100%\" cellpadding=\"0\" cellspacing=\"0\"><tr><td style=\"background:#fdf3e1;border-left:4px solid #d9822b;padding:9px 12px;font:13px Arial,sans-serif;color:#6b4710\">'Left-Handed Concerns' mentions are up 2.1x as a share of comments week over week (n=83).<\/td><\/tr><\/table><\/td><\/tr><tr><td style=\"padding:10px 28px 0\"><table role=\"presentation\" width=\"100%\" cellpadding=\"0\" cellspacing=\"0\"><tr><td style=\"background:#fdf3e1;border-left:4px solid #d9822b;padding:9px 12px;font:13px Arial,sans-serif;color:#6b4710\">'Waiting for Next Year' mentions are up 2.0x as a share of comments week over week (n=47).<\/td><\/tr><\/table><\/td><\/tr><tr><td style=\"padding:10px 28px 0\"><table role=\"presentation\" width=\"100%\" cellpadding=\"0\" cellspacing=\"0\"><tr><td style=\"background:#fdf3e1;border-left:4px solid #d9822b;padding:9px 12px;font:13px Arial,sans-serif;color:#6b4710\">3 new outperforming videos since the last run.<\/td><\/tr><\/table><\/td><\/tr><tr><td style=\"padding:10px 28px 0\"><table role=\"presentation\" width=\"100%\" cellpadding=\"0\" cellspacing=\"0\"><tr><td style=\"background:#fdf3e1;border-left:4px solid #d9822b;padding:9px 12px;font:13px Arial,sans-serif;color:#6b4710\">New audience topic since the last refresh: 'Waiting for Next Year' (149 comments).<\/td><\/tr><\/table><\/td><\/tr><tr><td style=\"padding:10px 28px 0\"><table role=\"presentation\" width=\"100%\" cellpadding=\"0\" cellspacing=\"0\"><tr><td style=\"background:#fdf3e1;border-left:4px solid #d9822b;padding:9px 12px;font:13px Arial,sans-serif;color:#6b4710\">New audience topic since the last refresh: 'Wanting Pro Cameras' (103 comments).<\/td><\/tr><\/table><\/td><\/tr>\n<tr><td style=\"padding:22px 28px 6px;font:600 12px Arial,sans-serif;letter-spacing:.06em;text-transform:uppercase;color:#66665f\">Watchlist<\/td><\/tr><tr><td style=\"padding:0 28px;font:13px/1.5 Arial,sans-serif;color:#1d1d1b\"><div style=\"padding:3px 0\"><b>Left-Handed Concerns<\/b>: gaining: 1.51x its usual share of recent comments (n=83)<\/div><div style=\"padding-top:6px;color:#66665f\">Left-Handed Concerns (1.51x usual share, n=83). New topics Wanting Pro Cameras (46.6% neg, 1.31x) and Waiting for Next Year (1.25x). Under-Display Camera (1.2x, 39.6% neg). Sentiment barely moved: pos -0.1pt, neg -0.6pt.<\/div><\/td><\/tr>\n<tr><td style=\"padding:22px 28px 24px;font:12px/1.5 Arial,sans-serif;color:#66665f;border-top:1px solid #e3e3dd;margin-top:18px\">Built from public YouTube data (official API) on English-language videos about the iPhone Duo. Comments are a sample of up to 60 per video, labelled by Claude. Differences between groups are associations, and small groups can swing. Open the attached dashboard.html to filter and drill down; reply in Slack to ask a follow-up.<\/td><\/tr>\n<\/table><\/td><\/tr><\/table><\/body><\/html>","slack":{"text":"Small channels lead iPhone Duo outperformers; large channels lag, and comment sentiment is split at 40.4% positive, 33.5% negative.","blocks":[{"type":"header","text":{"type":"plain_text","text":"iPhone Duo on YouTube: weekly readout"}},{"type":"section","text":{"type":"mrkdwn","text":"*Small channels lead iPhone Duo outperformers; large channels lag, and comment sentiment is split at 40.4% positive, 33.5% negative.*\nAcross 200 videos from 150 creators (226,175,822 views), 25.3% are outperformers and 25.9% underperformers. Sentiment covers 6,443 comments: 40.4% positive, 33.5% negative. Lift and sentiment are reported side by side and do not always agree. The top-lift videos rest on only 3 to 65 product comments, so their sentiment is thin. Since the last refresh: 22 new videos, 1,472 new comments, and little sentiment movement."}},{"type":"context","elements":[{"type":"mrkdwn","text":"200 videos · 226M views · 9,184 English comments · product sentiment 40% positive, 34% negative · data through 2026-10-04"}]},{"type":"divider"},{"type":"section","text":{"type":"mrkdwn","text":"*Coverage*\n200 videos from 150 creators (small 99, mid 50, large 51). 162 have 10+ product comments, so sentiment is read for those."}},{"type":"section","text":{"type":"mrkdwn","text":"*Performance: lift and sentiment side by side*\n• *Small* (99 videos): 37% outperformers · 40% positive / 33% negative\n• *Mid* (50 videos): 20% outperformers · 44% positive / 30% negative\n• *Large* (51 videos): 5% outperformers · 37% positive / 38% negative"}},{"type":"section","text":{"type":"mrkdwn","text":"*Audience topics*\n• *Samsung Did It First* (683 comments, 41% positive, 38% negative)\n• *Eager to Buy* (428 comments, 47% positive, 22% negative)\n• *Folding Phone Durability Doubts* (407 comments, 39% positive, 39% negative)\n• *Samsung Fold Comparisons* (400 comments, 48% positive, 31% negative)\n• *Name Jokes* (394 comments, 34% positive, 33% negative)"}},{"type":"section","text":{"type":"mrkdwn","text":"*Highlights*\n1. *Lift is concentrated in small channels*\n    _Brief more small and mid creators next week; judge large-channel videos against their own baselines, and report lift and sentiment in separate columns._\n2. *First impressions and comparisons lead on lift*\n    _Commission first-impression and comparison briefs next week; tag meme shorts separately so their low lift and negative tone are read apart._\n3. *Lifestyle vloggers show high lift and warmer tone*\n    _Pilot lifestyle-vlogger briefs; keep the 'other' group out of conclusions until more videos and comments accumulate._\n4. *Audience topics: Samsung framing dominates, intent is mixed*\n    _Ask creators to address the Samsung-first claim directly, and log buy versus skip intent counts weekly to track the balance._\n\n*Highest-lift videos*\n• <https://www.youtube.com/watch?v=3uiHvZwG8Vg|Why we are waiting to launch Limitless for the iPhone Duo> (Mous, 80.8x lift, 36% positive / 12% negative)\n• <https://www.youtube.com/watch?v=7Ws9Aj3iYFk|Apple Iphone duo unboxing and review , #iphoneduo #iphonefold> (Addii Roots, 71.3x lift, 29% positive / 45% negative)\n• <https://www.youtube.com/watch?v=qMOZBcfpEF4|iPhone Duo’s Camera Disappears #shorts> (Time Travel Visuals, 67.7x lift, 11% positive / 69% negative)"}},{"type":"section","text":{"type":"mrkdwn","text":"*Changes since last refresh*\n22 new videos, 1,472 new comments since 2026-10-04\n• new topic: *Waiting for Next Year* (149)\n• new topic: *Wanting Pro Cameras* (103)\n:rotating_light: 'Left-Handed Concerns' mentions are up 2.1x as a share of comments week over week (n=83).\n:rotating_light: 'Waiting for Next Year' mentions are up 2.0x as a share of comments week over week (n=47).\n:rotating_light: 3 new outperforming videos since the last run.\n:rotating_light: New audience topic since the last refresh: 'Waiting for Next Year' (149 comments).\n:rotating_light: New audience topic since the last refresh: 'Wanting Pro Cameras' (103 comments)."}},{"type":"section","text":{"type":"mrkdwn","text":"*Watchlist*\n• *Left-Handed Concerns*: gaining: 1.51x its usual share of recent comments (n=83)"}},{"type":"context","elements":[{"type":"mrkdwn","text":"Ask a follow-up: mention *@Launch Pulse* or message me. The full report is in your inbox."}]}]},"public":true,"examples":[{"q":"Which channel sizes break out most, and are their audiences happy? Give n.","a":"Small channels break out most: 31 of 83 videos (37.3%) were outperformers, versus 10 of 49 mid-size (20.4%) and 2 of 38 large (5.3%). Small channels' average relative lift was 7.8x, mid 3.5x, large 1.2x.\n\nAudience mood is mildly positive overall, but it doesn't track breakout rate. Mid-size channels are happiest: net sentiment +0.13 (43.6% positive, 30.4% negative, n=2,134 product comments). Small channels are +0.07 (39.9% positive, 32.8% negative, n=2,470). Large channels are roughly neutral at -0.01 (37.4% positive, 38.1% negative, n=1,839).\n\nCaveat: the large group has only 2 outperformers, so its rate is shaky. These are associations from a comment sample, not proof that channel size drives either result.","sql":"WITH base AS (SELECT c.video_id, CASE WHEN cr.tier IN ('nano <50k','micro 50-250k') THEN 'small' WHEN cr.tier='mid 250k-1M' THEN 'mid' WHEN cr.tier IN ('macro 1-5M','mega 5M+') THEN 'large' END AS size_group, p.outperformer, p.rel_lift FROM content c JOIN creators cr ON cr.channel_id=c.channel_id JOIN performance p ON p.video_id=c.video_id WHERE c.topic='duo' AND c.format!='official'), lift AS (SELECT size_group, COUNT(*) AS n_videos, SUM(outperformer) AS n_outperformers, ROUND(AVG(outperformer),3) AS outperformer_rate, ROUND(AVG(rel_lift),3) AS mean_rel_lift FROM base WHERE outperformer IS NOT NULL GROUP BY size_group), sent AS (SELECT b.size_group, COUNT(*) AS n_product_comments, ROUND(AVG(m.sentiment='positive'),3) AS pct_positive, ROUND(AVG(m.sentiment='negative'),3) AS pct_negative, ROUND(AVG(m.sentiment='positive')-AVG(m.sentiment='negative'),3) AS net_sent FROM comments m JOIN base b ON b.video_id=m.video_id WHERE m.lang='en' AND m.trivial=0 AND m.target IN ('product','price_value','apple_brand','competitor') GROUP BY b.size_group) SELECT l.size_group, l.n_videos, l.n_outperformers, l.outperformer_rate, l.mean_rel_lift, s.n_product_comments, s.pct_positive, s.pct_negative, CASE WHEN s.n_product_comments>=10 THEN s.net_sent END AS net_sentiment FROM lift l LEFT JOIN sent s ON s.size_group=l.size_group ORDER BY l.outperformer_rate DESC LIMIT 10"},{"q":"Which content formats work best for mid-sized channels?","a":"First impressions is the only format with a meaningful sample (n=19) and decent results: 36.8% outperformed, with a median rel_lift of 1.965 (mean 2.523).\n\nFull review (n=1, rate 100%, lift 15.4) and durability test (n=1, 100%, lift 6.4) look best on paper, but a single video each is an anecdote, not a pattern.\n\nExplainer tips (n=7) shows a mean lift of 10.2 but a median of 0.486 and only 14.3% outperforming, so one or two big hits are skewing it.\n\nComparison (n=6) and upgrade advice (n=8) had no outperformers, with median lifts of 1.318 and 0.729. Meme shorts (n=4, one lacking a baseline), keynote recaps (n=2) and other (n=2) also had none, but those samples are too small to judge.\n\nCaveat: these are associations in small samples, not proof that format drives performance.","sql":"WITH b AS (SELECT c.video_id, c.format, p.rel_lift, p.outperformer FROM content c JOIN creators cr ON cr.channel_id=c.channel_id JOIN performance p ON p.video_id=c.video_id WHERE c.topic='duo' AND c.format!='official' AND cr.tier='mid 250k-1M'), r AS (SELECT format, rel_lift, row_number() OVER (PARTITION BY format ORDER BY rel_lift) rn, count(*) OVER (PARTITION BY format) cnt FROM b WHERE rel_lift IS NOT NULL), med AS (SELECT format, avg(rel_lift) AS median_rel_lift FROM r WHERE rn IN ((cnt+1)/2,(cnt+2)/2) GROUP BY format) SELECT b.format, count(*) AS n_videos, count(b.outperformer) AS n_with_baseline, round(avg(b.outperformer),3) AS outperformer_rate, round(avg(b.rel_lift),3) AS mean_rel_lift, round(m.median_rel_lift,3) AS median_rel_lift FROM b LEFT JOIN med m ON m.format=b.format GROUP BY b.format ORDER BY outperformer_rate DESC, median_rel_lift DESC LIMIT 40"},{"q":"Which high-lift videos have the most negative audience reaction? Name two examples, with lift and sentiment shown separately.","a":"The two most negative high-lift videos are \"iPhone Duo's Camera Disappears #shorts\" (Time Travel Visuals) and \"iPhone FOLD Hands-On | Apple COOKED!\" (TechDroider).\n\n- Camera Disappears: lift 498.37 (rel_lift 67.7) on about 20.4M views. Net sentiment is -0.585 (n=65 product-side comments), with 69% negative and 11% positive.\n- FOLD Hands-On: lift 86.76 (rel_lift 11.8) on about 2.0M views. Net sentiment is -0.571 (n=49), with 71% negative and 14% positive.\n\nLift and sentiment are separate measures here. Both videos got outsized attention and a mostly negative product-side reaction.\n\nCaveat: these are associations from sampled comments, not proof that the videos caused the reaction. The n values are modest, so treat the percentages as rough.","sql":"WITH s AS (SELECT video_id, COUNT(*) AS n_product_side, SUM(sentiment='positive') AS pos, SUM(sentiment='negative') AS neg FROM comments WHERE lang='en' AND trivial=0 AND target IN ('product','price_value','apple_brand','competitor') GROUP BY video_id) SELECT c.video_id, c.title, cr.name AS channel_name, c.format, p.views, ROUND(p.lift,3) AS lift, ROUND(p.rel_lift,3) AS rel_lift, s.n_product_side, ROUND(s.pos*1.0/s.n_product_side,3) AS pct_positive, ROUND(s.neg*1.0/s.n_product_side,3) AS pct_negative, ROUND((s.pos-s.neg)*1.0/s.n_product_side,3) AS net_sentiment FROM content c JOIN creators cr ON cr.channel_id=c.channel_id JOIN performance p ON p.video_id=c.video_id JOIN s ON s.video_id=c.video_id WHERE c.topic='duo' AND c.format!='official' AND p.outperformer=1 AND s.n_product_side>=10 ORDER BY net_sentiment ASC, p.rel_lift DESC LIMIT 5"},{"q":"Which audience topics are largest, and which are growing fastest this week?","a":"Samsung Did It First is the largest topic: 683 comments, 7.4% of the 9,184 in scope. Next are Praise for review quality (504, 5.5%), Apple ad parody humor (435, 4.7%), Eager to Buy (428, 4.7%) and Folding Phone Durability Doubts (407, 4.4%).\n\nBy raw gain this week vs. the prior week, Samsung Did It First leads (70 to 169, +99), then Eager to Buy (53 to 147, +94), Left-Handed Concerns (+68) and Apple ad parody humor (+62).\n\nBy growth rate, Left-Handed Concerns is highest at 5.5x (15 to 83). Waiting for Next Year is 5.2x (9 to 47), Apple Software Integration 4.3x (7 to 30) and Wanting Pro Cameras 3.8x (9 to 34).\n\nCaveat: the fast risers start from small prior-week counts (n of 7 to 15), so the ratios exaggerate. Nearly every topic rose, so part of this is overall volume growth. Only Love for creator's videos fell (14 to 11).","sql":"WITH sc AS (SELECT cm.topic_id, cm.day_since_launch AS d FROM comments cm JOIN content ct ON ct.video_id=cm.video_id WHERE ct.topic='duo' AND ct.format!='official' AND cm.lang='en' AND cm.trivial=0), mx AS (SELECT MAX(d) AS m FROM sc), tot AS (SELECT COUNT(*) AS t FROM sc), agg AS (SELECT topic_id, COUNT(*) AS n, SUM(CASE WHEN d > m-7 THEN 1 ELSE 0 END) AS wk, SUM(CASE WHEN d <= m-7 AND d > m-14 THEN 1 ELSE 0 END) AS prev FROM sc, mx WHERE topic_id IS NOT NULL GROUP BY topic_id) SELECT t.topic_id, t.name, t.pool, t.origin, t.first_seen, a.n AS n_total, tot.t AS n_scope_comments, ROUND(1.0*a.n/tot.t,3) AS share_of_comments, a.wk AS n_this_week, a.prev AS n_prior_week, a.wk - a.prev AS change, ROUND(1.0*a.wk/NULLIF(a.prev,0),3) AS wow_ratio, mx.m AS latest_day FROM agg a JOIN topics t ON t.topic_id=a.topic_id, tot, mx ORDER BY a.n DESC LIMIT 40"},{"q":"How does audience sentiment on the iPhone Duo compare with the iPhone 18 Pro?","a":"Sentiment is a bit better for the iPhone 18 Pro than the Duo, mostly because it draws fewer negative comments. Overall net sentiment is +0.145 for the 18 Pro (n=3,087) versus +0.069 for the Duo (n=6,443). Positive shares are almost identical (40.3% vs 40.4%), but negative is 25.7% for the 18 Pro vs 33.5% for the Duo.\n\nBy target:\n- Product: 18 Pro +0.216 (n=2,552), Duo +0.158 (n=4,517).\n- Price/value: both negative, Duo -0.555 (n=672), 18 Pro -0.432 (n=229).\n- Competitor: both positive, 18 Pro +0.412 (n=187), Duo +0.346 (n=755).\n- Apple brand: Duo -0.313 (n=499), but 18 Pro is much worse at -0.672 (n=119).\n\nCaveat: this is a sample of comments, and the 18 Pro brand and competitor groups have small n, so those gaps are less firm.","sql":"WITH base AS (\n  SELECT c.topic AS topic, m.target AS target, m.sentiment AS sentiment\n  FROM comments m\n  JOIN content c ON c.video_id = m.video_id\n  WHERE c.topic IN ('duo','iphone_18_pro')\n    AND c.format != 'official'\n    AND m.lang = 'en' AND m.trivial = 0\n    AND m.target IN ('product','price_value','apple_brand','competitor')\n),\nrolled AS (\n  SELECT topic, 'all product-side' AS target, sentiment FROM base\n  UNION ALL\n  SELECT topic, target, sentiment FROM base\n)\nSELECT topic, target,\n  COUNT(*) AS n_product_side,\n  ROUND(AVG(sentiment='positive'),3) AS pct_positive,\n  ROUND(AVG(sentiment='neutral'),3) AS pct_neutral,\n  ROUND(AVG(sentiment='negative'),3) AS pct_negative,\n  ROUND(AVG(sentiment='positive') - AVG(sentiment='negative'),3) AS net_sentiment,\n  CASE WHEN COUNT(*) >= 10 THEN 'ok' ELSE 'n<10, not judged' END AS reliability\nFROM rolled\nGROUP BY topic, target\nORDER BY target != 'all product-side', target, topic\nLIMIT 40"},{"q":"What do people like most about the Duo, and what do they criticise most?","a":"Most-liked: excitement to buy. \"Eager to Buy\" (n=428) has a 47% positive share against 22% negative, with some people planning upgrades from Pro Max or Z Fold phones. Cases and accessories (n=230, 46% positive) and the near-invisible crease and fold animation (n=254, 46.5% positive) also lean positive.\n\nMost-criticised: the clearest negative lean is the under-display camera (n=275, 40% negative vs 25% positive). Price (n=385, 39.7% negative), durability doubts (n=407, 39.1%) and \"Samsung did it first\" (n=683, 37.8%) are also criticised, but each is split almost evenly between positive and negative.\n\nCaveat: these are topic-level tags on a comment sample, and most topics mix both sentiments. They show association, not cause, and \"liked\" topics still carry plenty of negative comments (e.g., Samsung comparisons are 31% negative, n=400).","sql":"WITH c AS (SELECT cm.topic_id, cm.sentiment FROM comments cm JOIN content ct ON ct.video_id=cm.video_id WHERE ct.topic='duo' AND ct.format!='official' AND cm.lang='en' AND cm.trivial=0 AND cm.target IN ('product','price_value','apple_brand','competitor')), t AS (SELECT tp.topic_id, tp.name, tp.summary, COUNT(*) AS n, SUM(c.sentiment='positive') AS n_pos, SUM(c.sentiment='negative') AS n_neg, ROUND(1.0*SUM(c.sentiment='positive')/COUNT(*),3) AS pos_share, ROUND(1.0*SUM(c.sentiment='negative')/COUNT(*),3) AS neg_share FROM c JOIN topics tp ON tp.topic_id=c.topic_id WHERE tp.pool='product' GROUP BY tp.topic_id, tp.name, tp.summary HAVING COUNT(*)>=10), liked AS (SELECT 'liked' AS side, name, summary, n, n_pos, n_neg, pos_share, neg_share FROM t WHERE n_pos>0 ORDER BY n_pos DESC LIMIT 8), crit AS (SELECT 'criticised' AS side, name, summary, n, n_pos, n_neg, pos_share, neg_share FROM t WHERE n_neg>0 ORDER BY n_neg DESC LIMIT 8) SELECT * FROM liked UNION ALL SELECT * FROM crit LIMIT 40"}]};

  const tp=t.t;return`<div class="small"><b>${esc(tp.name)}</b> ${isNew(tp)?`<span class="tag">discovered ${esc(tp.first_seen)}</span>`:""}<p style="margin:6px 0">${esc(tp.summary||"")}</p><span class="faint">Words that define the topic: ${esc(tp.terms)}</span></div>`+(PUB?`<div class="small faint" style="margin-top:6px">What positive comments say</div>${bl(s.positive)}<div class="small faint">What negative comments say</div>${bl(s.negative)}<p class="small faint" style="margin:0">Paraphrased from the most-liked comments, not quoted.</p>`:`<div class="small faint" style="margin-top:6px">Positive</div>${qs(tp.i,0)}<div class="small faint" style="margin-top:6px">Negative</div>${qs(tp.i,2)}`)};
 const sayRow=t=>{if(!t.t)return"";const s=sm(t.key),p=(s.positive||[])[0],n=(s.negative||[])[0];return`<div>${esc(t.t.summary||"")}</div>`+(p?`<div><b style="color:var(--pos)">+</b> ${esc(p)}</div>`:"")+(n?`<div><b style="color:var(--neg)">−</b> ${esc(n)}</div>`:"")};
 const trendCell=t=>!t.t?"":`<span class="small" data-tip="${esc(GL.trend)}">${t.t.trend==null?"–":t.t.trend.toFixed(2)+"x"} ${gaining(t.t)?`<span class="tag" style="color:var(--pos);border-color:var(--pos)">gaining</span>`:""}</span>`;
 const tbody=rows.map(t=>`<tr class="click ${sel(t)?"sel":""}" data-etopic="${esc(t.key)}"><td style="width:20%"><b>${t.t?`<span class="faint">${rank[t.key]}.</span> `:""}${esc(t.label)}</b>${t.t&&isNew(t.t)?`<div><span class="tag" style="border-style:dashed">new · ${esc(t.t.first_seen)}</span></div>`:""}</td><td class="num" style="width:8%">${t.n.toLocaleString()}</td><td style="width:18%">${sbar(t.c,METH.topic)}</td><td style="width:9%">${trendCell(t)}</td><td class="small">${sayRow(t)}</td></tr>`+(sel(t)?`<tr class="det"><td colspan="5">${det(t)}</td></tr>`:"")).join("");
 const ctab=CT.length?`<div class="card" style="margin-top:12px"><h3>What people say about the creators and videos <span class="faint small" style="font-weight:400">comments addressed to the creator or about the video itself, clustered the same way</span></h3><table><thead><tr>${TH("ct","topic","Topic",{text:1,dflt:DN})}${TH("ct","n","Comments",{num:1,dflt:DN})}${TH("ct","sent","Sentiment",{sent:1,info:"sent",dflt:DN})}<th>About</th></tr></thead><tbody>${srt(CT,"ct",TD,DN).map(t=>`<tr><td style="width:22%"><b>${esc(t.name)}</b></td><td class="num" style="width:8%">${t.n.toLocaleString()}</td><td style="width:20%">${sbar(t.c,METH.topic)}</td><td class="small">${esc(t.summary||"")}</td></tr>`).join("")}</tbody></table></div>`:"";
 return`<div class="grid g2" style="grid-template-columns:minmax(0,1.5fr) minmax(0,1fr)"><div class="card"><h3>Topic map ${info("map")}</h3>${map}</div><div class="card"><h3>Competitors mentioned ${info("rivals")}</h3>${riv}</div></div>
 <div style="margin-top:12px">${method}</div>
 <div class="card" style="margin-top:12px"><div class="row"><h3 style="margin:0">What people talk about <span class="faint small" style="font-weight:400">${PT.length} topics · ${pct(D.counts.assigned)} of product comments assigned</span></h3><div class="seg">${[["all","All topics"],["new","New since the first build"]].map(([k,l])=>`<button class="${S.atype===k?"on":""}" data-atype="${k}">${l}</button>`).join("")}</div></div>
 <table style="margin-top:8px"><thead><tr>${TH("tp","topic","Topic",{text:1,dflt:DN})}${TH("tp","n","Comments",{num:1,dflt:DN})}${TH("tp","sent","Sentiment",{sent:1,info:"sent",dflt:DN})}${TH("tp","trend","Trend",{info:"trend",dflt:DN})}<th>What people say</th></tr></thead><tbody>${tbody}</tbody></table></div>${ctab}`}
const ago=iso=>{const m=Math.max(0,Math.round((Date.now()-new Date(iso))/6e4));return m<60?m+" min ago":m<1440?Math.round(m/60)+" h ago":Math.round(m/1440)+" d ago"};
const fdt=iso=>new Date(iso).toLocaleString("en-US",{month:"short",day:"numeric",hour:"numeric",minute:"2-digit",timeZoneName:"short"});
function nextRun(){const n=new Date(),d=new Date(Date.UTC(n.getUTCFullYear(),n.getUTCMonth(),n.getUTCDate(),15,0,0));if(d<=n)d.setUTCDate(d.getUTCDate()+1);return{t:d,full:d.getUTCDay()===1}}
function statusBar(){const r=(D.runs||[]).slice(-1)[0],nx=nextRun();if(!r)return"";
 const sent=[r.email?"email":"",r.slack?"Slack digest":"",r.slack_alerts?"Slack alerts":""].filter(Boolean);
 return`<span><span class="dot ${r.ok?"":"bad"}"></span><b>Last refreshed</b> <span data-tip="${esc(fdt(r.finished))}">${ago(r.finished)}</span> · ${r.mode} run${r.source==="local"?" (local)":""}</span><span>${r.new_videos!=null?`+${r.new_videos} videos, +${(r.new_comments||0).toLocaleString()} comments`:""}</span><span>${sent.length?`Sent: ${sent.join(", ")}`:"Nothing sent on this run"}</span><span class="faint">Next: ${fdt(nx.t.toISOString())} (${nx.full?"full report":"light check"})</span><span class="sp"></span><button class="btn" disabled data-tip="Needs the server function that triggers the workflow, with a cooldown. Planned next.">Refresh now</button><a href="#" data-tab="auto" class="small">Run log</a>`}
const slackHtml=p=>{if(!p)return"";const mk=s=>esc(s).replace(/&lt;(https?:[^|&]+)\|([^&]*?)&gt;/g,'<a href="$1" target="_blank" rel="noopener">$2</a>').replace(/\*([^*]+)\*/g,"<b>$1</b>").replace(/(^|\s)_([^_]+)_/g,"$1<i>$2</i>").replace(/:rotating_light:/g,"🚨").replace(/\n/g,"<br>");
 return`<div class="slk"><div><span class="app">YouTube Creator Social Listening</span><span class="tag">APP</span> <span class="ctx">Monday 15:00 UTC</span></div>`+p.blocks.map(b=>b.type==="header"?`<h4>${esc(b.text.text)}</h4>`:b.type==="divider"?"<hr>":b.type==="section"?`<div style="margin:6px 0">${mk(b.text.text)}</div>`:b.type==="context"?`<div class="ctx">${b.elements.map(e=>mk(e.text)).join(" ")}</div>`:"").join("")+`</div>`};
function vAuto(){const runs=(D.runs||[]).slice().reverse();
 return`<div class="method" style="margin-bottom:12px"><b>How this runs on its own</b> A scheduled GitHub Actions job runs every day at 15:00 UTC. Most days it is a <b>light check</b>: new videos and comments, topic assignment, new-topic discovery, alerts to Slack only if something fired. On Mondays it is the <b>full report</b>: narrative, paraphrased topic notes, the email and the Slack digest. Each run commits a text-free state folder, so the next one is incremental, and rebuilds this page.</div>
 <div class="card"><h3>Run log</h3><table class="run"><thead><tr><th>Finished</th><th>Mode</th><th>Result</th><th class="num">New videos</th><th class="num">New comments</th><th>New topics</th><th>Sent</th><th>Steps</th></tr></thead><tbody>${runs.map(r=>`<tr><td>${esc(fdt(r.finished))}<div class="faint small">${esc(r.source)}</div></td><td>${esc(r.mode)}</td><td style="color:${r.ok?"var(--pos)":"var(--neg)"}">${r.ok?"ok":"failed"}</td><td class="num">${r.new_videos??"–"}</td><td class="num">${r.new_comments!=null?r.new_comments.toLocaleString():"–"}</td><td class="small">${esc((r.new_topics||[]).join(", ")||"–")}</td><td class="small">${[r.email?"email":"",r.slack?"Slack digest":"",r.slack_alerts?"Slack alerts":""].filter(Boolean).join(", ")||"–"}</td><td><div class="steps">${r.steps.map(s=>`<span title="${s.secs}s">${esc(s.name)} · ${s.secs}s</span>`).join("")}</div></td></tr>`).join("")}</tbody></table><p class="small faint" style="margin:8px 0 0">Only runs recorded so far are listed. The first row is a full local run without sending.</p></div>
 <div class="grid g2" style="grid-template-columns:minmax(0,700px) minmax(0,1fr);margin-top:12px"><div class="card"><h3>Weekly email</h3><p class="small mute" style="margin:0 0 8px">Summary, coverage, performance, audience topics, highlights, changes since last refresh, watchlist.</p>${D.email?`<iframe class="mail" sandbox srcdoc="${esc(D.email)}"></iframe>`:`<p class="faint small">Not available.</p>`}</div><div class="card"><h3>Slack digest</h3><p class="small mute" style="margin:0 0 8px">Posted to a channel; mention the app to ask follow-up questions.</p>${slackHtml(D.slack)}</div></div>`}
const TABS=[["overview","Overview",vOverview],["scale","Content insights",vScale],["audience","Audience insights",vAudience],["auto","Reports & automation",vAuto]];
/* ---------- shell ---------- */
function render(){$("#tabs").innerHTML=TABS.map(([k,l])=>`<button class="${S.tab===k?"on":""}" data-tab="${k}">${l}</button>`).join("");$("#status").innerHTML=statusBar();$("#view").innerHTML=TABS.find(t=>t[0]===S.tab)[2]();save();chatRender()}
function ctxText(){const sl=SLICE.filter(([k])=>S[k].length!==allOf(k).length).map(([k,l])=>l+"="+S[k].join("/"));return`${TABS.find(t=>t[0]===S.tab)[1]} page${S.tab==="scale"?", sorted by "+(S.ts.t||DT).k:""}${sl.length?", slice: "+sl.join("; "):""}`}
const SUG={overview:["Which creator types over-perform and at what channel size?","Which content types work best for mid-sized channels?"],scale:["Which videos have the highest lift and what is their audience reaction?","Do small channels get better sentiment than large ones?"],audience:["What are the main complaints and who makes them?","Which topics are gaining ground this week?"]};
function chatRender(){const ms=$("#ms");if(!ms)return;ms.innerHTML=(CHAT.length?"":`<p class="small mute" style="margin-top:0">${PUB&&!LIVE?"Recorded answers from the live agent. Pick a question:":"I answer from the same data as this page and show the query. I can see which page and slice you are on."}</p>`)+CHAT.map(m=>`<div class="bub ${m.r==="u"?"u":""}">${esc(m.t)}${m.sql?`<details style="margin-top:6px"><summary class="small mute" style="cursor:pointer">Show the query</summary><pre class="small" style="white-space:pre-wrap;word-break:break-word">${esc(m.sql)}</pre></details>`:""}</div>`).join("")+(PUB&&!LIVE?`<div style="margin-top:8px">${D.examples.filter(e=>!CHAT.some(m=>m.r==="u"&&m.t===e.q)).map(e=>`<span class="sg" data-sug="${esc(e.q)}">${esc(e.q)}</span>`).join("")}</div>`:(CHAT.length?"":SUG[S.tab].map(q=>`<span class="sg" data-sug="${esc(q)}">${esc(q)}</span>`).join("")));ms.scrollTop=ms.scrollHeight}
async function doAsk(q){q=(q||$("#askin").value).trim();if(!q)return;
 if(PUB&&!LIVE){const ex=D.examples.find(e=>e.q===q);CHAT.push({r:"u",t:q});CHAT.push({r:"a",t:ex?ex.a:"Not available in the public demo.",sql:ex?ex.sql:null});chatRender();return}
 $("#askin").value="";CHAT.push({r:"u",t:q});chatRender();$("#ms").insertAdjacentHTML("beforeend",`<div class="small faint">Working on it…</div>`);
 const hist=[];for(let i=0;i<CHAT.length-1;i++)if(CHAT[i].r==="u"&&CHAT[i+1]&&CHAT[i+1].r==="a")hist.push({q:CHAT[i].t,a:CHAT[i+1].t,sql:CHAT[i+1].sql||""});
 try{const r=await fetch(PUB?"/api/chat":"/api/ask",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({question:q,history:hist,context:ctxText()})});const d=await r.json();CHAT.push({r:"a",t:d.answer||("Error: "+(d.error||r.status)),sql:d.sql})}
 catch(e){CHAT.push({r:"a",t:location.protocol==="file:"?"Chat needs the local server: run python3 serve.py and open http://127.0.0.1:8770.":"Could not reach the server.",sql:null})}chatRender()}
const ABOUT=`<h2 style="margin-top:0">How to read this</h2><p><b>Outperformer</b>: ${GL.outperformer}</p><p><b>Underperformer</b>: ${GL.underperformer}</p><p><b>Lift</b>: ${GL.lift}</p><p><b>Lift and sentiment</b>: they measure different things (reach relative to the channel's usual views, and how commenters feel about the product), so the Content list shows both and lets you sort by either. They are not combined into a recommendation: a video that argues against buying, or is not really about the device, can reach many people while the comments do not read as positive.</p><p><b>Sentiment</b>: ${METH.ps}</p><p><b>Channel size</b>: ${GL.level}</p>
<h3>Limits</h3><ul><li>${D.counts.videos} English-language videos about the iPhone Duo from ${D.counts.creators} channels, found through YouTube searches. A sample of YouTube, not a census. iPhone 18 Pro videos are in the database for comparison questions in chat but not shown here.</li><li>${D.counts.comments_en.toLocaleString()} English comments with signal, up to 40 top and 20 newest per video, labelled by Claude. Top comments lean toward liked opinions.</li><li>Comments were labelled in two modes on different videos (${(D.counts.modes.full||0).toLocaleString()} deeper, ${(D.counts.modes.fast||0).toLocaleString()} faster), so small differences between videos can partly reflect that.</li><li>Region is the channel-declared country. Audience geography is not public.</li><li>Lift compares a video with the same channel's usual videos and with other Duo videos of the same format. Differences between groups are associations, and small groups are flagged.</li>${PUB?"<li>This public demo shows no comment text. Theme notes are paraphrased by Claude from the most-liked comments and checked so they do not reuse a comment's wording, and the chat shows recorded answers. Run the repo locally for quotes and the live chat.</li>":""}<li>Sponsorship and Apple seeding are not analysed: no sponsor in this data was Apple or a competitor, and seeding could not be verified from public data.</li></ul><p><button class="btn" data-act="aboutclose">Close</button></p>`;
$("#sub").textContent=`iPhone Duo on YouTube · launched ${new Date(D.event).toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric",timeZone:"UTC"})} · data through ${V.map(v=>v.pub).sort().pop()}`;
if(PUB){const pn=$("#pubnote");pn.style.display="block";pn.textContent="Public demo: no comment text is shown (topics are summarised in paraphrase) and the chat shows recorded answers. The live version runs locally from the repo.";$("#chatbtn").textContent="See example Q&A";$("#askin").disabled=true;$("#askin").placeholder="Recorded examples only. Run locally to ask your own.";fetch("/api/chat").then(r=>r.ok?r.json():null).then(j=>{if(j&&j.live){LIVE=true;pn.textContent="Public demo: no comment text is shown (topics are summarised in paraphrase). The chat answers live from a text-free copy of the data.";$("#chatbtn").textContent="Ask the data";$("#askin").disabled=false;$("#askin").placeholder="Ask about this launch…";chatRender()}}).catch(()=>{})}
const tt=$("#tt");
document.addEventListener("mouseover",e=>{const t=e.target.closest&&e.target.closest("[data-g],[data-tip]");if(!t){tt.style.display="none";return}const txt=t.dataset.tip||GL[t.dataset.g];if(!txt){tt.style.display="none";return}tt.textContent=txt;tt.style.display="block";const r=t.getBoundingClientRect(),w=tt.offsetWidth;tt.style.left=Math.max(8,Math.min(innerWidth-w-8,r.left+r.width/2-w/2))+"px";tt.style.top=(r.bottom+8+tt.offsetHeight>innerHeight?r.top-tt.offsetHeight-8:r.bottom+8)+"px"});
document.addEventListener("mouseout",e=>{const rt=e.relatedTarget;if(!rt||!rt.closest||!rt.closest("[data-g],[data-tip]"))tt.style.display="none"});
const same=(a,b)=>a.length===b.length&&a.every(x=>b.includes(x));
document.addEventListener("click",e=>{const t=e.target,c=s=>t.closest&&t.closest(s);let h;
 if(c(".info"))return;
 if(POP&&!c(".dd")){POP=null;render()}
 if(HM&&!c(".hm")){HM=null;render()}
 if(h=c("[data-dd]")){POP=POP===h.dataset.dd?null:h.dataset.dd;render()}
 else if(h=c("[data-all]")){e.preventDefault();const[k,v]=h.dataset.all.split(":");S[k]=v==="1"?allOf(k):[];render()}
 else if(h=c("[data-tab]")){POP=null;S.tab=h.dataset.tab;S.open=null;render()}
 else if(h=c("[data-unslice]")){S[h.dataset.unslice]=allOf(h.dataset.unslice);render()}
 else if(h=c("[data-cell]")){const[rk,r,ck,cv]=h.dataset.cell.split("|");if(same(S[rk],[r])&&same(S[ck],[cv])){S[rk]=allOf(rk);S[ck]=allOf(ck)}else{S[rk]=[r];S[ck]=[cv]}render()}
 else if(h=c("[data-row]")){const[k,r]=h.dataset.row.split("|");S.kexp=S.kexp===r?null:r;render()}
 else if(h=c("[data-col]")){const[k,r]=h.dataset.col.split("|");S[k]=same(S[k],[r])?allOf(k):[r];render()}
 else if(h=c("[data-fsel]")){const f=h.dataset.fsel;S.format=f==="*"||same(S.format,[f])?allOf("format"):[f];render()}
 else if(h=c("[data-hm]")){HM=HM===h.dataset.hm?null:h.dataset.hm;render()}
 else if(h=c("[data-ts]")){e.preventDefault();const[id,k,d]=h.dataset.ts.split("|");if(d==="0")delete S.ts[id];else S.ts[id]={k,d:+d};HM=null;render()}
 else if(h=c("[data-totall]")){const[a,b]=h.dataset.totall.split("|");S[a]=allOf(a);S[b]=allOf(b);render()}
 else if(h=c("[data-tot]")){const[k,v]=h.dataset.tot.split("|");S[k]=same(S[k],[v])?allOf(k):[v];render()}
 else if(h=c("[data-atype]")){S.atype=h.dataset.atype;render()}
 else if(h=c("[data-etopic]")){S.etopic=S.etopic===h.dataset.etopic?null:h.dataset.etopic;render()}
 else if(h=c("[data-open]")){S.open=S.open===h.dataset.open?null:h.dataset.open;render();if(S.open&&h.tagName==="circle"){const r=document.querySelector(".det");r&&r.scrollIntoView({block:"center",behavior:"smooth"})}}
 else if(h=c("[data-sug]")){doAsk(h.dataset.sug)}
 else if(h=c("[data-act]")){const[a,v]=h.dataset.act.split(":");
  if(a==="reset"){e.preventDefault();const t0=S.tab;S=defaults();S.tab=t0;POP=null;render()}
  else if(a==="more"){S.more[v]=!S.more[v];render()}else if(a==="about"){$("#mbox").innerHTML=ABOUT;$("#modal").classList.add("open")}else if(a==="aboutclose"){$("#modal").classList.remove("open")}
  else if(a==="chat"){$("#chat").classList.add("open");$("#chatbtn").style.display="none";chatRender();$("#askin").focus()}else if(a==="chatclose"){$("#chat").classList.remove("open");$("#chatbtn").style.display="block"}else if(a==="ask"){doAsk()}
  else if(a==="csv"){const vs=sorted(base());csv("content_list.csv",[["video","url","creator","region","level","content type","lift","views","engagement rate","positive","negative","product comments"]].concat(vs.map(x=>[x.t,x.url,x.cr_.name,regionOf(x),x.cr_.tier,LBL.f[x.f],x.rl==null?"":x.rl.toFixed(2),x.vw,x.er.toFixed(4),nps(x)?posOf(x).toFixed(2):"",nps(x)?negOf(x).toFixed(2):"",nps(x)])))}}});
document.addEventListener("change",e=>{const k=e.target.dataset&&e.target.dataset.chk;if(k){const[g,v]=k.split(/:(.*)/s),a=S[g],i=a.indexOf(v);i>=0?a.splice(i,1):a.push(v);render()}});
document.addEventListener("input",e=>{if(e.target.id==="qin"){const p=e.target.selectionStart;S.q=e.target.value;render();const i=$("#qin");if(i){i.focus();i.setSelectionRange(p,p)}}});
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.id==="askin")doAsk();if(e.key==="Escape")$("#modal").classList.remove("open")});
$("#modal").addEventListener("click",e=>{if(e.target.id==="modal")e.target.classList.remove("open")});
render();
</script></body></html>
