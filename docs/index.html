er foldables exist."]},"p02":{"positive":["Many credit Samsung for pioneering foldables and supplying the screen, and say competition should push other makers to respond.","Some remain loyal to their Samsung Fold, while others say this is the first foldable they would consider buying."],"negative":["Commenters say Samsung and other Android makers released foldables and features like split screen many years ago, so Apple's version looks late and unoriginal.","Many mock Apple fans for getting excited about familiar tech, and note Apple once dismissed foldables but is now entering the category.","Some say Apple relies on Samsung's screens or copies it, and a few predict the product will be short-lived."]},"p03":{"positive":["Many viewers were pleasantly surprised by the iPhone Duo, praising its look, minimal crease, matte inner screen, and polished unfolding animation.","Several commenters said the Samsung Fold 8 looks better or is preferred, citing its design, rectangular shape, and thin, light build.","Some see Apple's advantages in the wider aspect ratio when unfolded, the ecosystem and software, and a durable titanium build."],"negative":["Many see Apple's foldable as very late, with Samsung and Google having sold foldables for years, and criticise Apple fans for treating it as new.","The price draws heavy criticism: commenters say it costs as much as an iPhone plus an iPad, or far more than comparable Samsung models.","Design complaints include the odd outer screen shape and aspect ratio, uneven rounded corners, matte display and size; some say Samsung's cover screen and desktop features are better."]},"p04":{"positive":["Many commenters expected a higher launch price and were pleasantly surprised it came in lower than predicted.","Pricing is seen as in line with Samsung's foldables and typical for the foldable category, so it feels reasonable.","Some say the price is acceptable given the larger screen and Apple ecosystem, even if they give up camera features."],"negative":["Many commenters find the price far too high, saying a phone costing around two thousand dollars or more is out of reach for most people.","Several point to big regional price gaps, with countries like India, Mexico and Australia seen as especially costly relative to local incomes.","Some say the foldable design is interesting but not worth a large investment, since they don't need one or want less phone time."]},"p05":{"positive":["Many commenters prefer a clean, uninterrupted inner screen over a visible cutout or dot, and see the hidden camera as a sensible trade-off.","Several say they rarely take selfies on the inner display and would use the outer camera, so lower image quality matters little to them.","Some praise the polished animation and transition that reveal the camera, and expect the technology to improve as rivals respond."],"negative":["Many commenters say under-display cameras are not new, since several earlier phones had them, so they don't see this as an Apple innovation.","Commenters say the technology lowers selfie and video-call image quality, and some think this is why other brands moved away from it.","The camera is still visible on the inner screen, so it isn't truly hidden, and some feel this defeats the purpose and looks unattractive."]},"p06":{"positive":["Many left-handed commenters say they're used to right-handed designs and adapt easily, so they see the layout as a minor issue or non-issue.","Several defend the design choices, such as the right-side dock and top volume buttons, as logical, and suggest workarounds like rotating the phone or changing dock position.","Some appreciate that left-handed use was acknowledged, and some think the phone suits lefties; others would like a dedicated left-hand mode."],"negative":["Many left-handed commenters feel the Duo's design favors right-handed use, with the dock, interface and navigation placed on the right, making it awkward or frustrating.","Several note the problem goes beyond software: the fingerprint button, outer display and cameras are positioned for right hands, so a mirrored version might be needed.","Commenters want a setting to flip the dock and menus to the left, similar to Apple Watch, and some say they would skip the phone."]},"p07":{"positive":["Apple Pencil compatibility is repeatedly named as a standout feature, with several viewers saying it alone convinced them to buy or pre-order.","Some Android foldable owners say Apple's pen support beats Samsung's folds, and they wish S Pen support would return.","Viewers see the large inner screen as a mini iPad with phone abilities, making pen support useful for productivity."],"negative":["Many see Apple as copying Samsung and others rather than innovating, and criticise fans for treating a foldable as a breakthrough.","Some use the Apple Pencil omission to urge Samsung to restore S Pen support, while also complaining about the high price."]},"p08":{"positive":["Many commenters praise the smooth open and close transition animation, saying it feels like looking through glass to the inner screen.","The nano-texture inner display is liked for its matte look and for reducing fingerprints and glare, including light on the fold crease.","Some see the screen, water resistance and expected pencil support as a strong package, comparing it favorably to a cellular tablet that folds."],"negative":["Many commenters say the nano-texture matte finish lowers clarity, vibrancy and brightness, and some prefer a glossy inner screen.","Several doubt the matte coating is worth it, saying it is just a rebrand of matte and may be worse in sunlight.","Some say it is a trade-off to reduce the crease, but the crease is barely noticeable on current foldables, so the loss isn't justified."]},"p09":{"positive":["Many commenters are impatient for release and plan to pre-order or buy right away, with a few saying they are excited enough to count down the wait.","Owners of older or larger iPhones, some who skipped upgrades for years, see the foldable as a worthwhile reason to upgrade or trade in."],"negative":["Many find the price too high, especially compared with the Pro Max, and some say regional pricing is even worse.","Commenters plan to wait for a second or later generation, expecting fixes for weak cameras, weight, screen durability and the hinge.","Several say it offers little over an iPad mini or a Pro Max, since it gives up camera quality, Face ID and battery."]},"p10":{"positive":["Several say the case and overall design make them more tempted to buy, even if price or other plans hold them back."],"negative":["Commenters say the foldable is already heavy and thick, and a case adds more bulk and weight, making it feel unwieldy.","Case design draws criticism: the folio and kickstand styles cover the camera, front or edges, with too many flaps and limited drop protection.","Many worry about protecting the expensive device, especially the outer screen, and say bumper-style cases seem hard to fit."]},"p11":{"positive":["Many commenters expect a well-known durability YouTuber to put the phone through bend and break tests, and joke or speculate about whether it will survive.","Some think Apple designed the phone with these tests in mind, citing reinforcement details, and feel confident it will hold up.","Others stay cautious about first-generation durability and would wait before buying, or compare it with rival foldables and ask for fairer testing conditions."],"negative":["Commenters worry the phone looks fragile and could break from a single drop, especially around the visible line across the middle.","Several point to the antenna line or middle seam as a structural weak point that may become more noticeable over time.","Some criticise the high price for a device whose durability hasn't been properly tested, and note the screen scratches fairly easily."]},"p12":{"positive":["Night Sky, the dark blue-black option, is the most popular pick, with many planning to buy it and praising its clean, understated look.","Some prefer white or silver for its classic Apple feel, and one commenter says the dark finish makes the bezels look larger.","Larger storage sizes such as 512GB and 1TB are commonly chosen, often paired with a taupe folio case; a few are still undecided on color."],"negative":["Many commenters see storage-tier pricing outside the US, such as Australia and New Zealand, as very high compared with currency-converted US prices.","Battery life is a frequent worry: people feel the device drains power quickly, dislike the battery icon, and want Apple to disclose the capacity.","Some are unhappy with the color options and naming, wanting black or a truer white, and note visible creases and inaccurate inner-display color."]},"p13":{"positive":["Many like the compact folded size, seeing it as a replacement for small phones like the mini while still offering a large unfolded screen.","Commenters praise the foldable form factor and software, including smooth open/close animations, side toolbar, and screen switching, and some say it could replace their tablet.","Several say it is the most exciting iPhone in years, a fresh design change, and they would buy it or pre-order."],"negative":["Many commenters say the foldable design is not new, pointing to existing foldables from other brands and the old Surface Duo.","Size and pocketability are a concern: some say it is too big and awkward to carry or hold, even when folded.","Some dislike the folio-style design: a covered front screen limits selfies and quick use, and the layout may not suit left-handed users."]},"p14":{"positive":["The animations, transitions and overall polish of the foldable software impress people, including some who are unsure about foldables or don't plan to buy one.","Some say rivals offer more features and flexibility, but Apple's refined, optimized experience and ecosystem appeal still draw some Samsung users and long-time Apple fans."],"negative":["Many see the foldable as a Samsung-style device with Apple software, since the hardware resembles existing foldables and relies on Samsung parts.","Commenters mock the idea that Apple is pioneering folding phones, and say reviewers' enthusiasm overstates novelty given earlier devices from Samsung and Microsoft.","Software is seen as Apple's main strength, but some note limits such as a setting that can't be toggled, and a locked-down ecosystem."]},"p15":{"positive":["Many commenters say they plan to buy or pre-order the iPhone Duo, including Android users and long-time Apple fans, and some would gift it.","The fold transition animation and software polish get strong praise, with some saying Android makers should focus on UI as well as hardware.","Some compare it with Samsung's foldable, noting the Duo is heavier and thicker, though others attribute the weight to premium materials."],"negative":["Many commenters mock the name 'Duo' and wish Apple had picked something like Fold, and some compare it to Microsoft's Surface Duo.","Several joke that Apple will present small tweaks, such as a slightly reduced crease or square corners, as big upgrades, and they see the buyers as easily impressed.","Commenters criticise the phone as heavy, thick and awkward to use, point to Samsung-made parts, and joke that the name refers to paying double the price."]},"p16":{"positive":["Many commenters say durability worries are premature or misplaced, noting that demo units were plastic dummies while the real device uses a sturdier metal build.","Several defend the high price, arguing it reflects the dual-screen design rather than pro-level features, and that other folding phones cost similarly.","Fans are excited about the smooth fold animation, the pocketable tablet-phone combination for travel, and the fit with the Apple ecosystem."],"negative":["Many commenters expect the hinge and crease to wear out the phone over time, and doubt it will last.","Several worry the foldable is fragile, hard to protect with a case, and likely to be ruined by one drop.","Others say the high price, around two thousand, is unjustified for a device with durability concerns and little new over existing foldables."]},"p17":{"positive":["Viewers praise the design and polish, especially the smooth opening animation, the attention to detail, and the look of the new software on the device.","Several commenters see practical value in the larger, reading-friendly screen for professionals such as doctors and legal workers, and like the orientation and camera bump choices."],"negative":["Several are wary of first-generation hardware, citing costly screen repairs, hinge durability, and a visible crease, and some would wait for Apple's next models.","Others criticise design and practicality: hinge placement, matte finish hurting contrast, rounded corners, awkward camera use, and limited novelty versus existing foldables."]},"p18":{"positive":["Many commenters see the foldable as a pocketable tablet that could replace carrying an iPad or iPad mini, and some would sell their iPad for it.","Professionals such as surveyors and contractors say the larger inner screen would make plans and manuals easier to read on the go.","Others value the bigger display for video, gaming, multitasking, reading and larger text, and like the wide shape and matte screen."],"negative":["Many see the Duo as essentially a small iPad or a late copy of rivals' foldables, with little real innovation.","Software feels limited: crowded home screen, restrictive multitasking (no two apps in landscape), awkward gestures, and little developer support for the extra space.","Hardware and price worries: matte inner screen in sunlight, odd outer display, crease or durability doubts, cases and protectors, impracticality when folded, high cost, no stylus support."]},"p19":{"positive":["Many praise the redesigned iOS for the foldable, saying it looks polished and well integrated, with thoughtful touches like layout changes that keep apps working without extra optimization.","Commenters are excited and pleasantly surprised by the launch, calling it impressive and saying they want to try it in person.","Some say Apple focuses on how a product feels to use, and a few Android users also express support or interest in iOS on a foldable."],"negative":["Many commenters say the price is excessive, especially outside the US, where taxes and import costs push it to several times the US figure.","Android users say the multitasking and split-screen features are old news, and iOS still seems less mature and less optimised for them.","Others criticise the hinge and opening mechanism, the visible crease, and the awkward design. Some doubt the demo and the reviewer's downplaying of these issues."]},"p20":{"positive":["Commenters praise the hinge as properly engineered, contrasting it with hollow or lazy-looking foldable designs, and are confident it is durable.","Some note that IP68 ratings on foldables usually exclude the hinge, so water resistance claims on other brands may be misleading.","The rounded outer edge and asymmetric corners are liked for a softer, notebook-like feel, easier holding and a tidy look when open or closed."],"negative":["Commenters doubt that an IP68 rating means much on a foldable, since the hinge area stays open to dust and may let particles in.","Some note that water and dust resistance is expected to wear down over time, so they would not take a pricey foldable to the beach unprotected.","Others worry the hinge will wear out with frequent folding, and point to other foldables that had durability problems despite similar ratings."]}}},"public":true,"examples":[{"q":"Which channel sizes break out most, and are their audiences happy? Give n.","a":"Small channels break out most: 28 of 74 videos with a baseline (38%) were outperformers, versus 10 of 47 for mid-size channels (21%) and just 2 of 36 for large channels (6%).\n\nAudience mood is mixed everywhere. Mid-size channels are happiest, with 43% positive and 31% negative comments (net +0.13, n=1,842 comments). Small channels are mildly positive at 40% positive and 34% negative (net +0.07, n=2,025). Large channels are basically neutral to slightly negative, at 38% positive and 38% negative (net −0.01, n=1,594).\n\nSo the small channels get the most breakouts with a lukewarm audience, while mid-size channels pair decent breakouts with the best sentiment.\n\nCaveat: the large group has only 36 baseline videos and 2 outperformers, so its rate is shaky. These are associations in a comment sample, not causes.","sql":"WITH v AS (SELECT c.video_id, CASE WHEN cr.tier IN ('nano <50k','micro 50-250k') THEN 'small' WHEN cr.tier='mid 250k-1M' THEN 'mid' WHEN cr.tier IN ('macro 1-5M','mega 5M+') THEN 'large' END AS size_group, p.outperformer FROM content c JOIN creators cr ON cr.channel_id=c.channel_id JOIN performance p ON p.video_id=c.video_id WHERE c.topic='duo' AND c.format!='official'), vp AS (SELECT size_group, COUNT(*) AS n_videos, COUNT(outperformer) AS n_videos_with_baseline, SUM(outperformer) AS n_outperformers, ROUND(AVG(outperformer),3) AS outperformer_rate FROM v GROUP BY size_group), cs AS (SELECT v.size_group, COUNT(*) AS n_product_comments, ROUND(AVG(m.sentiment='positive'),3) AS pct_positive, ROUND(AVG(m.sentiment='negative'),3) AS pct_negative, ROUND(AVG(m.sentiment='positive')-AVG(m.sentiment='negative'),3) AS net_sentiment FROM comments m JOIN v ON v.video_id=m.video_id WHERE m.lang='en' AND m.trivial=0 AND m.target IN ('product','price_value','apple_brand','competitor') GROUP BY v.size_group) SELECT vp.size_group, vp.n_videos, vp.n_videos_with_baseline, vp.n_outperformers, vp.outperformer_rate, cs.n_product_comments, cs.pct_positive, cs.pct_negative, cs.net_sentiment FROM vp LEFT JOIN cs ON cs.size_group=vp.size_group ORDER BY vp.outperformer_rate DESC LIMIT 40"},{"q":"Which content formats work best for mid-sized channels?","a":"First impressions is the only format with a meaningful sample (n=19) and it does fairly well: 37% outperformed their baseline, avg relative lift 2.46, and the most positive sentiment among larger groups (net +0.24). Full review and durability test both show a 100% outperformer rate, but each is n=1, so that's anecdotal. Explainer/tips (n=5) has a high avg lift of 9.98 but only 20% outperformers, suggesting one or two big hits are driving it. Comparison (n=6), upgrade advice (n=8), keynote recap (n=2), meme shorts (n=4) and other (n=2) had zero outperformers. Upgrade advice sentiment was positive (+0.25, n=8) despite lift under 1, while keynote recaps were notably negative (-0.55, n=2). Caveat: these are associations from small samples, not proof a format causes success.","sql":"SELECT c.format, COUNT(*) AS n_videos, SUM(CASE WHEN p.outperformer IS NOT NULL THEN 1 ELSE 0 END) AS n_with_baseline, ROUND(AVG(p.outperformer),3) AS outperformer_rate, ROUND(AVG(p.rel_lift),3) AS avg_rel_lift, SUM(CASE WHEN v.n_product_side>=10 THEN 1 ELSE 0 END) AS n_sent_videos, ROUND(AVG(CASE WHEN v.n_product_side>=10 THEN v.pct_positive - v.pct_negative END),3) AS avg_net_sentiment FROM content c JOIN creators cr ON cr.channel_id=c.channel_id JOIN performance p ON p.video_id=c.video_id JOIN v_content v ON v.video_id=c.video_id WHERE c.topic='duo' AND c.format!='official' AND cr.tier='mid 250k-1M' GROUP BY c.format HAVING n_with_baseline>0 ORDER BY outperformer_rate DESC, avg_rel_lift DESC LIMIT 40"},{"q":"Why are some high-lift videos not ready to scale? Name two examples.","a":"Because their audiences are reacting negatively to the product, even though views are high. Both videos have net sentiment far below the typical +0.048 (across 152 videos).\n\nExample 1: TechDroider's \"iPhone FOLD Hands-On\" (first impressions, macro tier) has lift 86.7 (8.2x relative). Among n=41 product comments, 12% are positive and 71% negative, for net -0.585. The top complaint theme is crease and screen quality.\n\nExample 2: Time Travel Visuals' \"iPhone Duo's Camera Disappears\" (short, mid tier) has lift 496.7 (46.9x relative). Among n=50 product comments, 12% are positive and 68% negative, for net -0.56. The top negative theme is that Android phones did this first.\n\nCaveat: n is modest for both (41 and 50), and the comments are a sample, so treat this as a signal, not proof.","sql":"WITH pc AS (SELECT video_id, COUNT(*) AS n_product, AVG(sentiment='positive') AS pos, AVG(sentiment='negative') AS neg FROM comments WHERE lang='en' AND trivial=0 AND target IN ('product','price_value','apple_brand','competitor') GROUP BY video_id), base AS (SELECT ct.video_id, ct.title, ct.format, cr.name AS creator, cr.tier, p.lift, p.rel_lift, p.outperformer, pc.n_product, pc.pos, pc.neg, pc.pos-pc.neg AS net FROM content ct JOIN creators cr ON cr.channel_id=ct.channel_id JOIN performance p ON p.video_id=ct.video_id JOIN pc ON pc.video_id=ct.video_id WHERE ct.topic='duo' AND ct.format!='official' AND pc.n_product>=10), typ AS (SELECT AVG(net) AS typical_net, COUNT(*) AS n_videos FROM base) SELECT b.creator, b.title, b.format, b.tier, ROUND(b.lift,3) AS lift, ROUND(b.rel_lift,3) AS rel_lift, b.n_product, ROUND(b.pos,3) AS pct_pos, ROUND(b.neg,3) AS pct_neg, ROUND(b.net,3) AS net, ROUND(t.typical_net,3) AS typical_net, t.n_videos, (SELECT th.theme FROM comments c JOIN comment_themes th ON th.comment_id=c.comment_id WHERE c.video_id=b.video_id AND c.lang='en' AND c.trivial=0 AND c.sentiment='negative' AND c.target IN ('product','price_value','apple_brand','competitor') GROUP BY th.theme ORDER BY COUNT(*) DESC LIMIT 1) AS top_negative_theme FROM base b, typ t WHERE b.outperformer=1 AND b.net < t.typical_net-0.05 ORDER BY b.net ASC LIMIT 2"},{"q":"Inside the price discussion, which sub-topics are most negative and which are positive?","a":"Almost every price sub-topic skews negative; only one is clearly positive.\n\nMost negative: regional price gap (n=142, net -0.845, 87% negative), overpriced for the tradeoffs (n=65, net -0.80, 86% negative), and cost jokes (n=61, net -0.754, 87% negative). Affordability barrier (n=81, net -0.654) and comparisons to Pro and iPad (n=33, net -0.576) are also strongly negative. The general bucket (n=190) sits at -0.547.\n\nMilder or positive: storage, trade-in and financing is negative but softer (n=46, net -0.283). The Samsung Fold comparison is roughly split (n=78, net -0.064, 36% positive vs 42% negative). The only clearly positive sub-topic is \"fair for foldables\" (n=68, net +0.662, 72% positive).\n\nCaveat: these are associations in a comment sample, not causes, and the smaller groups (n=33 to 68) are less stable.","sql":"SELECT c.price_sub, COUNT(*) AS n, ROUND(AVG(c.sentiment='positive'),3) AS pct_positive, ROUND(AVG(c.sentiment='neutral'),3) AS pct_neutral, ROUND(AVG(c.sentiment='negative'),3) AS pct_negative, ROUND(AVG(c.sentiment='positive') - AVG(c.sentiment='negative'),3) AS net_sentiment FROM comments c JOIN content v ON v.video_id=c.video_id JOIN comment_themes t ON t.comment_id=c.comment_id AND t.theme='price_affordability' WHERE v.topic='duo' AND v.format!='official' AND c.lang='en' AND c.trivial=0 AND c.target IN ('product','price_value','apple_brand','competitor') AND c.price_sub IS NOT NULL GROUP BY c.price_sub ORDER BY net_sentiment ASC LIMIT 40"},{"q":"How does audience sentiment on the iPhone Duo compare with the iPhone 18 Pro?","a":"The iPhone 18 Pro gets better sentiment than the Duo, though the gap comes from negatives, not positives. Net sentiment is +0.149 for the 18 Pro (n=2,673 comments across 92 videos) versus +0.064 for the Duo (n=5,461 across 167 videos).\n\nPositive share is almost identical: 40.5% for the Duo and 40.3% for the 18 Pro. The difference is that the Duo draws more negative comments (34.1% vs 25.4%) and fewer neutral ones (25.4% vs 34.3%). Duo commenters are more polarized, while 18 Pro comments are more often neutral.\n\nBoth samples are fairly large, so the gap looks real. Still, these are YouTube comments on non-official videos, so they reflect who comments, not all buyers, and the numbers show association, not cause.","sql":"SELECT c.topic, COUNT(*) AS n_product_side, COUNT(DISTINCT c.video_id) AS n_videos, ROUND(AVG(m.sentiment='positive'),3) AS pct_positive, ROUND(AVG(m.sentiment='neutral'),3) AS pct_neutral, ROUND(AVG(m.sentiment='negative'),3) AS pct_negative, ROUND(AVG(m.sentiment='positive')-AVG(m.sentiment='negative'),3) AS net_sentiment FROM comments m JOIN content c ON c.video_id=m.video_id WHERE c.topic IN ('duo','iphone_18_pro') AND c.format!='official' AND m.lang='en' AND m.trivial=0 AND m.target IN ('product','price_value','apple_brand','competitor') GROUP BY c.topic LIMIT 40"},{"q":"What do people like most about the Duo, and what do they criticise most?","a":"Praise centers on excitement and the fold experience; criticism centers on price. Hype and purchase excitement is the most positive theme (n=629, 90% positive, 1.6% negative), though it's about enthusiasm rather than a specific feature. Among product features, the fold animation and UI is the best liked (n=316, 71% positive, 20% negative). Android comparisons are also mostly favorable (n=1,170, 50% positive, 31% negative).\n\nPrice is the biggest complaint (n=764, 65% negative, 17% positive), followed by the idea that Android makers did it first (n=448, 63% negative). Apple brand and leadership comments lean negative too (n=363, 51% negative). Crease/screen quality, camera hardware and durability are mildly negative (n=349 to 431, about 36% to 41% negative).\n\nCaveat: these are associations in a sample of 5,461 product-side comments, not proof of what drives opinions. A comment can also be counted under more than one theme.","sql":"WITH base AS (SELECT c.comment_id, c.sentiment FROM comments c JOIN content v ON v.video_id=c.video_id WHERE v.topic='duo' AND v.format!='official' AND c.lang='en' AND c.trivial=0 AND c.target IN ('product','price_value','apple_brand','competitor')), tot AS (SELECT count(*) AS total FROM base) SELECT t.theme, count(*) AS n, sum(b.sentiment='positive') AS n_pos, sum(b.sentiment='negative') AS n_neg, round(1.0*sum(b.sentiment='positive')/count(*),3) AS pct_pos, round(1.0*sum(b.sentiment='negative')/count(*),3) AS pct_neg, round(1.0*(sum(b.sentiment='positive')-sum(b.sentiment='negative'))/count(*),3) AS net_sent, round(1.0*count(*)/(SELECT total FROM tot),3) AS share_of_product_side, (SELECT total FROM tot) AS total_product_side_n FROM base b JOIN comment_themes t ON t.comment_id=b.comment_id GROUP BY t.theme ORDER BY n_pos DESC LIMIT 40"}]};

 else if(h=c("[data-atype]")){S.atype=h.dataset.atype;render()}
 else if(h=c("[data-etopic]")){S.etopic=S.etopic===h.dataset.etopic?null:h.dataset.etopic;render()}
 else if(h=c("[data-open]")){S.open=S.open===h.dataset.open?null:h.dataset.open;render();if(S.open&&h.tagName==="circle"){const r=document.querySelector(".det");r&&r.scrollIntoView({block:"center",behavior:"smooth"})}}
 else if(h=c("[data-sug]")){doAsk(h.dataset.sug)}
 else if(h=c("[data-act]")){const[a,v]=h.dataset.act.split(":");
  if(a==="reset"){e.preventDefault();const t0=S.tab;S=defaults();S.tab=t0;POP=null;render()}
  else if(a==="more"){S.more[v]=!S.more[v];render()}else if(a==="about"){$("#mbox").innerHTML=ABOUT;$("#modal").classList.add("open")}else if(a==="aboutclose"){$("#modal").classList.remove("open")}
  else if(a==="chat"){$("#chat").classList.add("open");$("#chatbtn").style.display="none";chatRender();$("#askin").focus()}else if(a==="chatclose"){$("#chat").classList.remove("open");$("#chatbtn").style.display="block"}else if(a==="ask"){doAsk()}
  else if(a==="csv"){const vs=sorted(base());csv("content_list.csv",[["video","url","creator","region","level","content type","lift","views","engagement rate","positive","negative","product comments"]].concat(vs.map(x=>[x.t,x.url,x.cr_.name,regionOf(x),x.cr_.tier,LBL.f[x.f],x.rl==null?"":x.rl.toFixed(2),x.vw,x.er.toFixed(4),nps(x)?posOf(x).toFixed(2):"",nps(x)?negOf(x).toFixed(2):"",nps(x)])))}}});
document.addEventListener("change",e=>{const k=e.target.dataset&&e.target.dataset.chk;if(k){const[g,v]=k.split(/:(.*)/s),a=S[g],i=a.indexOf(v);i>=0?a.splice(i,1):a.push(v);render()}});
document.addEventListener("input",e=>{if(e.target.id==="qin"){const p=e.target.selectionStart;S.q=e.target.value;render();const i=$("#qin");if(i){i.focus();i.setSelectionRange(p,p)}}});
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.id==="askin")doAsk();if(e.key==="Escape")$("#modal").classList.remove("open")});
$("#modal").addEventListener("click",e=>{if(e.target.id==="modal")e.target.classList.remove("open")});
render();
</script></body></html>
