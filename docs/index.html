"subs":216,"region":"undeclared"},{"i":159,"name":"Matt Kahla, Jr.","kol":"pro_reviewer","tier":"micro 50-250k","subs":85600,"region":"US"}],"quotes":[],"brands":["Samsung","Google Pixel","Xiaomi","Oppo / Honor / Huawei"],"counts":{"videos":212,"creators":160,"comments_en":10034,"as_of":"2026-10-05","assigned":0.928,"modes":{"fast":8386,"full":2275}},"event":"2026-09-09","product":{"name":"iPhone Duo","brand":"Apple"},"summaries":{"topics":{"p01":{"positive":["Many commenters praise the opening and closing animation as smooth, clean and clever, and credit the design team, including some who usually dislike Apple.","Several say the matte inner screen is a smart way to hide the crease, and some note the crease looks barely visible.","A few see the animation, which responds to the hinge angle, as a sign that apps could use fold-aware features, and call it a standout moment of the presentation."],"negative":["Several viewers dismiss the fold animation as a minor, easily copied feature that doesn't justify the premium price.","Others criticise the high regional prices and possible repair costs, saying rival foldables are cheaper."]},"p02":{"positive":["Many commenters praise the smooth, polished opening and closing animations and say the software feels premium for a first-generation foldable.","Several self-described Samsung Fold users admit they are surprised and impressed by Apple's approach, even though they expected less.","Some like specific design choices, such as thumb-friendly menu placement, and see the device as an exciting change for iPhone."],"negative":["Apple is mocked for once dismissing foldables and now launching one, with fans accused of praising a feature they previously ignored.","Some criticise the device itself: a high price, laggy animations, a visible crease, and a camera or storage setup that falls short."]},"p03":{"positive":["Many viewers were pleasantly surprised by the iPhone Duo, praising its design, matte inner screen, minimal crease and polished unfolding animation, and some now consider buying it.","Several expect Apple's ecosystem, interface, durable materials and fixed unfolded aspect ratio to give it an edge over Samsung's foldables.","Others prefer the Galaxy Z Fold 8, citing its squarer shape, thin and light build, symmetrical design and rectangular edges, with some Fold owners welcoming Apple."],"negative":["Commenters say Apple is very late to foldables and gets credit for an idea Samsung and Google introduced years earlier.","Many mock the high price, arguing it matches an iPhone plus an iPad and that Samsung's folds offer better value.","Design draws criticism: the outer screen's shape and rounded corners look odd or impractical, and Samsung's front screen and features are seen as better."]},"p04":{"positive":["Many commenters expected a higher price, with guesses well above the actual figure, and were pleasantly surprised it launched lower.","Several note the price is roughly in line with Samsung's foldables and typical for the category, which they see as competitive.","Some welcome the added competition in foldables and say the pricing makes them more open to considering one."],"negative":["Many commenters say the foldable is far too expensive, jokingly reading the \"Duo\" name as paying double and saying few people can afford a phone this costly.","Several point to steep regional pricing, especially in India and Mexico, where the cost is out of reach for most people compared with local wages and rival foldables.","Some object to rising electronics prices in general, saying people have grown too accepting and that a big spend on a phone isn't justified."]},"p05":{"positive":["Many commenters prefer a clean inner screen without a cutout or dot, and are willing to accept lower selfie camera quality for it.","Several say they rarely take selfies on the inner display and use the outer screen camera or the phone mainly for media, so camera quality matters little.","Some praise the polished execution, including the camera-hiding animation and fold transitions, and hope the approach spreads to other phones."],"negative":["Commenters say the camera isn't truly hidden. It stays visible on the screen, which undercuts the clean, immersive look it is meant to give.","Several people say under-display cameras lower image quality, which is why most people prefer a punch-hole camera or other placement, and they question the feature at this price."]},"p06":{"positive":["Many left-handed commenters say they are used to right-handed designs and see the dock placement as a minor issue, not a dealbreaker.","Several left-handed users already hold their phone in the right hand or use it with either hand, so they expect to adapt easily."],"negative":["Many commenters say the Duo's layout and one-handed interface favour right-handed users, making it awkward or frustrating for left-handed people.","Some point out that hardware, not just software, is the issue: button, outer display and camera placement would need a mirrored version, and a settings toggle may not be enough.","Others note that people hold or tap with different hands, so the right-side dock and asymmetric design could bother them regardless of handedness."]},"p07":{"positive":["Apple Pencil compatibility is a major selling point; several viewers say it made them want to buy or pre-order the foldable.","Android foldable owners, especially Samsung users, say Apple's pen support beats their own device and hope stylus support returns to Samsung's folds.","Pen support is valued alongside other features like water resistance and a larger inner screen, which suit productivity and tablet-style use."],"negative":["Many commenters say Apple is copying competitors, especially Samsung, rather than innovating, and mock Apple fans for praising it.","Others worry a hard stylus could scratch or damage the folding inner screen, or complain the pencil support is limited and the price too high."]},"p08":{"positive":["Many commenters praise the smooth open and close transition, saying it makes the outer screen feel like transparent glass over the inner display.","The matte nano-texture inner screen is liked for reducing fingerprints and fold-crease visibility, and for a paper-like feel with the Apple Pencil.","Several see the screen, durability rating and upcoming pencil support as a strong package, with the nano-texture finish seen as a worthwhile trade-off."],"negative":["The jump from the glossy outer display to the matte inner one looks odd, and the coating is seen as an unnecessary way to hide a crease.","Commenters worry about the inner screen's durability, since it can't take a screen protector, and mention a visible line and a screen that doesn't open fully flat."]},"p09":{"positive":["Some say the design looks better than expected, with a fresh, different look that has grown on them and broken their boredom with recent iPhones.","Long-time owners of older iPhones see it as a worthwhile upgrade, and some value replacing both phone and tablet or find trade-in pricing acceptable."],"negative":["Many commenters want the foldable but find the price far too high, so they will skip it or stick with a Pro Max.","Several plan to wait for later generations, expecting lower prices, fewer first-version flaws and a lighter design.","Some say weight, camera and Face ID trade-offs, or an iPad mini as an alternative, make the device less appealing."]},"p10":{"positive":["Many viewers like the Apple folio case: it looks good, protects well, and keeps the large inner screen free of smudges and scratches.","Several commenters say the case and the phone's design, folding animations and features have moved the Duo into their buy list, though price is a concern."],"negative":["Folio and kickstand cases are seen as awkward: covers get in the way of the camera, quick payments and the front screen, and the folio leaves edges exposed.","Commenters worry the phone is already thick and heavy, and a case adds more bulk and weight, possibly weighing more than a small tablet.","Some are unsure how to protect the outer screen from scratches, and whether a thick case would reduce wobbling when the phone is open."]},"p11":{"positive":["Many commenters expect a well-known durability YouTuber to put the phone through bend and break tests, and joke that it may not survive.","Some think Apple designed it with such tests in mind, pointing to reinforced areas, and feel confident it will hold up.","Others like the design but are cautious about a first-generation foldable, preferring to wait or to compare it with rival foldables under the same test conditions."],"negative":["Commenters worry the foldable screen will scratch easily and develop a visible crease along the fold within a few months of use.","Many think the phone looks fragile and could break from a single drop, with the antenna line placement seen as a structural weak point.","The high price feels unjustified to some while durability remains unproven; they await teardown and bend tests before trusting it."]},"p12":{"positive":["Night Sky (dark blue-black) is the most frequently named pick, praised as understated and attractive, with several commenters planning day-one purchases.","Star White is the main alternative, with some choosing it for a jewelry-like look or because dark bezels appear larger; many are torn between the two.","Storage choices mentioned lean toward higher tiers such as 512GB and 1TB, often paired with a taupe folio case."],"negative":["Many commenters worry about battery life and drain, and question Apple's vagueness about battery size and its confusing runtime claims.","Regional pricing is a frequent complaint: storage tiers in Australia and New Zealand are seen as far more expensive than currency conversions suggest.","Some dislike the color options and names, wanting a plain black or white, and note the inner display's color looks inaccurate."]},"p13":{"positive":["Many like the compact folded size, saying it revives the appeal of small phones while still offering a large unfolded screen for media.","Commenters are excited that Apple is trying something new with the form factor, and several say it is their most interesting iPhone in years.","Some praise the software and design details, including smooth fold transitions, a side toolbar that saves space, gesture navigation, and a folio that wraps around the back."],"negative":["Several dislike design choices: the front screen is covered or unusable for selfies, left-handed users may struggle, and the screen seems fragile."]},"p14":{"positive":["Animations, new interaction modes and attention to detail in the foldable software impress people, and some who doubted foldables or use other brands now say they are tempted to buy or switch.","Some admit rivals offer more flexibility and earlier foldables, but still expect Apple's software and ecosystem, plus better third-party app support, to set the Duo apart."],"negative":["Many commenters say Apple's foldable and its software features are not original, pointing to Samsung, Microsoft and other makers that released similar devices and multitasking ideas earlier.","Some feel the long wait only produced hardware similar to rivals, so Apple's software is its main advantage. Others argue software is where devices often fall short.","Concerns include slow app developer support for the new form, software updates affecting battery life, and the cover screen shape and visible crease."]},"p15":{"positive":["Praise centres on the polished fold transition animation, software polish, and strong performance compared with Samsung's foldables."],"negative":["Many commenters mock the name and the lack of a more obvious one like \"Fold,\" and some say it resembles Microsoft's Surface Duo.","Commenters joke that the name hints at double the price, and they compare the cost unfavorably with rival foldables and other big purchases.","Several joke that Apple only offers small yearly tweaks, such as a slightly smaller crease, and that Samsung parts do much of the work."]},"p16":{"positive":["Commenters defend the phone against durability worries, saying early doubts were based on a plastic dummy unit while the real device uses a sturdier material.","Fans are excited about the fold animation and iOS ecosystem, and some say Apple finally made them want a folding phone."],"negative":["Many commenters expect the hinge and crease to wear down over time, and doubt the phone would survive a drop.","Several say the foldable offers little protection and is hard to case, and some find it heavy and bulky.","Much of the doubt is about value: a roughly $2,000 price seems unjustified, especially with modest base storage."]},"p17":{"positive":["Many viewers praise the design and polish, especially the smooth opening animation, the camera bump layout and the overall look of the software on the device.","Several commenters see practical value in a larger folding screen for reading documents, charts and case files, and like the vertical, one-handed use."],"negative":["Several are wary of first-generation hardware and cite concerns such as hinge durability, camera compromises, missing features, large size, and screen space lost to rounded corners.","Praise for the video is often paired with doubt or sarcasm about the phone, including its name, Apple's late entry into foldables, and claims of innovation."]},"p18":{"positive":["Many commenters see the foldable as a pocketable replacement for carrying an iPad or iPad mini, especially for work tasks like reading plans or manuals.","A larger inner screen is welcomed for video streaming, gaming, multitasking, photos and bigger text, with some liking the wide aspect ratio and matte finish.","Some praise design details such as the screen transition animation, button placement, and added fingerprint options, and expect the foldable to push developers toward better tablet-optimised apps."],"negative":["Many see the Duo as essentially a small iPad in phone form, and as late, unambitious catching up to rivals that already offer foldables.","Commenters dislike the matte inner screen, calling it dull and hard to see in sunlight. They also criticise the visible crease, cluttered home screen, and awkward outer screen shape.","Concerns include very high price and repair costs, difficult cases and protectors, limited multitasking (such as no landscape split apps), and weak developer support for the larger space."]},"p19":{"positive":["Many commenters say iOS is what makes this foldable appealing, citing a refined, polished software design and sensible layout changes for the wider screen.","Several people who had no interest in foldables, including some Android users, say Apple's version impresses them or has them considering a purchase.","Some Android fans welcome it, expecting it to push Samsung and Google to improve their own foldables, and they like having both platforms."],"negative":["Many commenters find the price too high, and say regional pricing and taxes make it far worse outside the US, such as in India and Brazil.","Several say the foldable's features, like split screen, are nothing new, and that Android foldables already offer them, so Android users have little reason to switch.","Others criticise the hinge and opening mechanism, the visible crease, and iOS multitasking and app optimisation, and say the reviewer downplayed these flaws."]},"p20":{"positive":["Several like the rounded, booklet-like edge design, saying it feels softer, is easy to hold and pocket, and looks good both open and closed.","Commenters also admire the glass-style opening animation and say the Liquid Glass interface suits the device. Some doubt it would break easily."],"negative":["Commenters doubt that an IP68 rating means much on a foldable, since the hinge area is thought to stay open to dust and wear.","Some expect water and dust resistance to fade over time, and say they would not take an expensive foldable to the beach unprotected.","Frequent folding is seen as a durability risk, with worry the hinge could wear out quickly and that rivals' foldables have had similar problems despite their ratings."]},"p21":{"positive":["Many commenters are eager for the foldable iPhone and plan to buy it at launch or preorder, though some will wait for a later model.","Some are holding off to compare other foldables or camera-focused phones, or to look for trade-in deals and discounts.","Viewers like the polish, camera flexibility and creative uses of the folding design, and trust Apple to handle durability concerns like the crease."],"negative":["Many commenters say foldable phones are not new, accusing Apple of arriving years late and copying rivals while reviewers treat it as groundbreaking.","Many suspect Apple deliberately leaves out features such as the flagship or telephoto camera so it can add them in later models and keep people upgrading.","Others complain about the high price, large bezels, the closed shape and display compromises, saying it doesn't justify the cost or the wait."]},"p22":{"positive":["Several commenters like the Duo's design but wish it came with the Pro-level cameras, or say they would hold out for a later version.","Some are keen to buy despite the high price, and cite the thin titanium build and durability of the Air as reassurance."],"negative":["Many commenters say the Duo's cameras fall short of the Pro's, such as the missing telephoto and main lens, so they would skip it or wait for a later model.","The price is a major complaint, especially in countries with high local prices or taxes, and people doubt it is justified.","Other missing features also put people off, including no Face ID, a matte display, weaker battery, extra weight, and limited speakers."]},"p23":{"positive":["Several commenters see the lack of Face ID as a plus and welcome the return of fingerprint unlock, calling it fast and practical.","Some say Face ID is awkward at a desk or when entering a PIN often, and prefer a simpler unlock method.","Others are won over by extras such as Apple Watch unlock and stylus support, though a few still say Face ID is superior."],"negative":["Many commenters call the missing Face ID a dealbreaker and say they would skip the device because of it.","Some find fingerprint unlocking inconvenient, citing hand difficulties and smudges, though a few say they prefer Touch ID for security."]},"p24":{"positive":["A wordplay about Apple's leadership passing from Steve to Tim to John appeared repeatedly, framing the foldable as a new chapter for the company.","Many praised the smooth folding animation, saying it gives a polished, signature-Apple feel and makes folding and unfolding satisfying.","Several joked that the larger inner screen suits watching a Nolan film as intended, and some said they plan to buy one anyway."],"negative":["Many commenters say Apple has lost its innovative spirit since Steve Jobs died, calling recent products uninspiring and unexciting.","Several imagine Jobs would be unhappy with the product or the team, and compare today's keynotes unfavorably with his.","Some criticize specific design choices, such as the stylus or missing a physical vibrate switch, and say Apple is milking customers."]}}},"runs":[{"started":"2026-10-04T22:58:39+00:00","finished":"2026-10-04T23:04:39+00:00","mode":"weekly","ok":true,"source":"local","new_videos":22,"new_comments":1472,"new_topics":["Waiting for Next Year","Wanting Pro Cameras"],"alerts":5,"email":false,"slack":false,"slack_alerts":false,"steps":[{"name":"collect new videos, refresh stats","status":"ok","secs":10},{"name":"classify new videos","status":"ok","secs":14},{"name":"channel baselines and lift","status":"ok","secs":34},{"name":"creator types","status":"ok","secs":10},{"name":"pull and label new comments","status":"ok","secs":59},{"name":"build tables","status":"ok","secs":0},{"name":"assign comments to topics, discover new ones","status":"ok","secs" a href=\"https://www.youtube.com/watch?v=qMOZBcfpEF4\" style=\"color:#2f5bea;text-decoration:none\">iPhone Duo’s Camera Disappears #shorts<\/a><br><span style=\"color:#66665f;font-size:12px\">Time Travel Visuals · mid (250k-1M) · Explainer / tips · 72.9x lift · 20483k views · sentiment -60<\/span><\/td><\/tr><\/table><\/td><\/tr>\n<tr><td style=\"padding:22px 28px 6px;font:600 12px Arial,sans-serif;letter-spacing:.06em;text-transform:uppercase;color:#66665f\">What changed since last refresh<\/td><\/tr><tr><td style=\"padding:0 28px;font:13px/1.5 Arial,sans-serif;color:#1d1d1b\"><div style=\"padding:3px 0\">12 new videos and 850 new comments since 2026-10-04.<\/div><div style=\"padding:3px 0\">Sentiment score: -1.6 pts.<\/div><div style=\"padding:3px 0\">New topic: <b>No Face ID<\/b> (42 comments).<\/div><div style=\"padding:3px 0\">New topic: <b>Steve, Tim, John Joke<\/b> (32 comments).<\/div><\/td><\/tr>\n<tr><td style=\"padding:10px 28px 0\"><table role=\"presentation\" width=\"100%\" cellpadding=\"0\" cellspacing=\"0\"><tr><td style=\"background:#fdf3e1;border-left:4px solid #d9822b;padding:9px 12px;font:13px Arial,sans-serif;color:#6b4710\">'Left-Handed Concerns' mentions are up 2.4x as a share of comments week over week (n=89).<\/td><\/tr><\/table><\/td><\/tr><tr><td style=\"padding:10px 28px 0\"><table role=\"presentation\" width=\"100%\" cellpadding=\"0\" cellspacing=\"0\"><tr><td style=\"background:#fdf3e1;border-left:4px solid #d9822b;padding:9px 12px;font:13px Arial,sans-serif;color:#6b4710\">'Waiting for Next Year' mentions are up 1.8x as a share of comments week over week (n=51).<\/td><\/tr><\/table><\/td><\/tr><tr><td style=\"padding:10px 28px 0\"><table role=\"presentation\" width=\"100%\" cellpadding=\"0\" cellspacing=\"0\"><tr><td style=\"background:#fdf3e1;border-left:4px solid #d9822b;padding:9px 12px;font:13px Arial,sans-serif;color:#6b4710\">2 new outperforming videos since the last run.<\/td><\/tr><\/table><\/td><\/tr>\n<tr><td style=\"padding:22px 28px 6px;font:600 12px Arial,sans-serif;letter-spacing:.06em;text-transform:uppercase;color:#66665f\">Watchlist<\/td><\/tr><tr><td style=\"padding:0 28px;font:13px/1.5 Arial,sans-serif;color:#1d1d1b\"><div style=\"padding:3px 0\"><b>Under-Display Camera<\/b>: sentiment score -18 (n=302)<\/div><div style=\"padding-top:6px;color:#66665f\">Watch Under-Display Camera (score -18, on watchlist), Left-Handed Concerns (trend 1.46), whether No Face ID grows beyond n=42, and whether overall sentiment score +5 holds after positive share slipped 1.1 points.<\/div><\/td><\/tr>\n<tr><td style=\"padding:22px 28px 24px;font:12px/1.5 Arial,sans-serif;color:#66665f;border-top:1px solid #e3e3dd;margin-top:18px\">Built from public YouTube data (official API) on English-language videos about the iPhone Duo. Comments are a sample of up to 60 per video, labelled by Claude. Differences between groups are associations, and small groups can swing. Open the attached dashboard.html to filter and drill down; reply in Slack to ask a follow-up.<\/td><\/tr>\n<\/table><\/td><\/tr><\/table><\/body><\/html>","slack":{"text":"iPhone Duo coverage is mixed: sentiment score +5, with small channels outperforming and large channels lagging on views.","blocks":[{"type":"header","text":{"type":"plain_text","text":"EXAMPLE · iPhone Duo on YouTube: weekly readout"}},{"type":"section","text":{"type":"mrkdwn","text":"*iPhone Duo coverage is mixed: sentiment score +5, with small channels outperforming and large channels lagging on views.*\nThe 212 videos from 160 creators drew 227.3M views. 25.4% of videos were outperformers and 27.7% underperformers. Sentiment score is +5 (39.3% positive, 33.9% negative) on 7,046 comments, covering 167 of 212 videos. Lift is strongest among small channels, while large-channel comments lean negative. Samsung comparisons dominate the conversation. Purchase intent outweighs skip intent, though a few negative topics are growing."}},{"type":"context","elements":[{"type":"mrkdwn","text":"212 videos · 227M views · 10,034 English comments · sentiment score +5 · data through 2026-10-05"}]},{"type":"section","text":{"type":"mrkdwn","text":"*Content performance: highest-lift videos*\n• <https://www.youtube.com/watch?v=3uiHvZwG8Vg|Why we are waiting to launch Limitless for the iPhone Duo> (Mous, 87.2x lift, sentiment +25)\n• <https://www.youtube.com/watch?v=7Ws9Aj3iYFk|Apple Iphone duo unboxing and review , #iphoneduo #iphonefold> (Addii Roots, 77.4x lift, sentiment -13)\n• <https://www.youtube.com/watch?v=qMOZBcfpEF4|iPhone Duo’s Camera Disappears #shorts> (Time Travel Visuals, 72.9x lift, sentiment -60)"}},{"type":"section","text":{"type":"mrkdwn","text":"*Audience insights: top topics*\n• *Samsung Did It First* (1,061 comments, sentiment +1)\n• *Eager to Buy* (572 comments, sentiment +22)\n• *Price Complaints* (479 comments, sentiment -5)\n• *Folding Phone Durability Doubts* (457 comments, sentiment -2)\n• *Samsung Fold Comparisons* (448 comments, sentiment +15)"}},{"type":"section","text":{"type":"mrkdwn","text":"*Changes since last refresh*\n12 new videos, 850 new comments since 2026-10-04\n• new topic: *No Face ID* (42)\n• new topic: *Steve, Tim, John Joke* (32)\n:rotating_light: 'Left-Handed Concerns' mentions are up 2.4x as a share of comments week over week (n=89).\n:rotating_light: 'Waiting for Next Year' mentions are up 1.8x as a share of comments week over week (n=51).\n:rotating_light: 2 new outperforming videos since the last run."}},{"type":"section","text":{"type":"mrkdwn","text":"*Watchlist*\n• *Under-Display Camera*: sentiment score -18 (n=302)"}},{"type":"context","elements":[{"type":"mrkdwn","text":"Example of the Slack digest, to show the format. Figures are illustrative and not guaranteed to be accurate. Ask a follow-up: mention the app or message it. The full report is in your inbox."}]}]},"public":true,"examples":[{"q":"Which channel sizes break out most, and are their audiences happy? Give n.","a":"Small channels break out most, and their audiences are mildly positive. Mid-size audiences are the happiest.\n\n- Small: 36% outperformers (89 videos with a baseline, of 110). Net sentiment is +6 (39% positive, 33% negative) across 2,723 product-side comments.\n- Mid: 22% outperformers (n=50 with a baseline, of 51 videos). Net sentiment is +11 (42% positive, 31% negative) across 2,358 comments.\n- Large: 5% outperformers (n=38 with a baseline, of 51 videos). Net sentiment is about -3 (36% positive, 39% negative) across 1,965 comments.\n\nAverage relative lift follows the same order: about 8.0 for small, 3.7 for mid and 1.3 for large.\n\nCaveat: the mid and large video counts are modest, and the sentiment gaps are small. Treat these as associations in a comment sample, not causes.","sql":"WITH vids AS (SELECT c.video_id, CASE WHEN cr.tier IN ('nano <50k','micro 50-250k') THEN 'small' WHEN cr.tier='mid 250k-1M' THEN 'mid' WHEN cr.tier IN ('macro 1-5M','mega 5M+') THEN 'large' END AS size_grp, p.outperformer, p.rel_lift FROM content c JOIN creators cr ON cr.channel_id=c.channel_id JOIN performance p ON p.video_id=c.video_id WHERE c.topic='duo' AND c.format!='official'), lift AS (SELECT size_grp, COUNT(*) AS n_videos, COUNT(outperformer) AS n_with_baseline, ROUND(AVG(outperformer),3) AS outperformer_rate, ROUND(AVG(rel_lift),3) AS avg_rel_lift FROM vids GROUP BY size_grp), sent AS (SELECT v.size_grp, COUNT(*) AS n_product_side, ROUND(AVG(m.sentiment='positive'),3) AS pct_positive, ROUND(AVG(m.sentiment='negative'),3) AS pct_negative, ROUND(AVG(m.sentiment='positive')-AVG(m.sentiment='negative'),3) AS net_raw FROM comments m JOIN vids v ON v.video_id=m.video_id WHERE m.lang='en' AND m.trivial=0 AND m.target IN ('product','price_value','apple_brand','competitor') GROUP BY v.size_grp) SELECT l.size_grp, l.n_videos, l.n_with_baseline, l.outperformer_rate, l.avg_rel_lift, s.n_product_side, s.pct_positive, s.pct_negative, CASE WHEN s.n_product_side>=10 THEN s.net_raw END AS net_sentiment FROM lift l LEFT JOIN sent s ON s.size_grp=l.size_grp ORDER BY l.outperformer_rate DESC LIMIT 40"},{"q":"Which content formats work best for mid-sized channels?","a":"First impressions is the only format with a real sample that works well for mid-sized channels: 8 of 19 videos (42%) outperformed their baseline, with an average relative lift of 2.7 and net sentiment of +23 (n=1,050 product-side comments).\n\nFull review and durability test both outperformed 100% of the time, but each has only 1 video, so treat them as anecdotes. Their net sentiment was +22 (n=60) and -20 (n=41).\n\nExplainer/tips had a high average lift (9.7) but only 1 of 8 videos outperformed (13%), so a single hit probably drives the average. Net sentiment was -7 (n=326).\n\nComparison (6 videos), upgrade advice (8), meme short (4) and keynote recap (2) had no outperformers. Keynote recap sentiment was the weakest at -54 (n=79).\n\nCaveat: these are associations from small video counts, not proof that a format causes the result.","sql":"WITH v AS (SELECT c.video_id, c.format, p.rel_lift, p.outperformer FROM content c JOIN creators cr ON cr.channel_id=c.channel_id JOIN performance p ON p.video_id=c.video_id WHERE c.topic='duo' AND c.format!='official' AND cr.tier='mid 250k-1M'), s AS (SELECT v.format, COUNT(*) AS n_product_side, SUM(m.sentiment='positive') AS pos, SUM(m.sentiment='negative') AS neg FROM comments m JOIN v ON v.video_id=m.video_id WHERE m.lang='en' AND m.trivial=0 AND m.target IN ('product','price_value','apple_brand','competitor') GROUP BY v.format) SELECT v.format, COUNT(*) AS n_videos, COUNT(v.outperformer) AS n_with_baseline, ROUND(AVG(v.outperformer),3) AS outperformer_rate, ROUND(AVG(v.rel_lift),3) AS avg_rel_lift, s.n_product_side, CASE WHEN s.n_product_side>=10 THEN ROUND(1.0*(s.pos-s.neg)/s.n_product_side,3) END AS net_sentiment FROM v LEFT JOIN s ON s.format=v.format GROUP BY v.format ORDER BY outperformer_rate DESC, avg_rel_lift DESC LIMIT 40"},{"q":"Which high-lift videos have the most negative audience reaction? Name two examples, with lift and sentiment shown separately.","a":"Two top examples: \"iPhone Duo's Camera Disappears #shorts\" (Time Travel Visuals) and \"iPhone FOLD Hands-On | Apple COOKED!\" (TechDroider).\n\nThe Camera Disappears short has a lift of 499.3 (72.9x relative lift) but a net sentiment of -60 (n=77), with 10% positive and 70% negative.\n\nThe TechDroider hands-on has a lift of 86.8 (12.7x relative) and a net sentiment of -52 (n=56), with 18% positive and 70% negative.\n\nBoth samples are reasonably sized. Lift and sentiment are separate measures here, so high reach doesn't mean approval. These are associations from a sample of comments, not proof of why viewers reacted this way.","sql":"WITH s AS (SELECT video_id, COUNT(*) AS n_product_side, AVG(sentiment='positive') AS pos, AVG(sentiment='negative') AS neg FROM comments WHERE lang='en' AND trivial=0 AND target IN ('product','price_value','apple_brand','competitor') GROUP BY video_id) SELECT c.video_id, c.title, cr.name AS creator, c.format, ROUND(p.lift,3) AS lift, ROUND(p.rel_lift,3) AS rel_lift, s.n_product_side, ROUND(s.pos,3) AS pct_positive, ROUND(s.neg,3) AS pct_negative, ROUND(s.pos-s.neg,3) AS net_sentiment FROM content c JOIN performance p ON p.video_id=c.video_id JOIN creators cr ON cr.channel_id=c.channel_id JOIN s ON s.video_id=c.video_id WHERE c.topic='duo' AND c.format!='official' AND p.outperformer=1 AND s.n_product_side>=10 ORDER BY net_sentiment ASC, p.rel_lift DESC LIMIT 10"},{"q":"Which audience topics are largest, and which are growing fastest this week?","a":"Samsung Did It First is the largest topic (n=1,061, 13.2% of comments) and is also growing, up from 98 to 285 comments week over week (share 12.3% to 14.1%). Next largest are Eager to Buy (n=572, 7.1%) and Praise for review quality (n=544, 6.8%).\n\nLeft-Handed Concerns is growing fastest. It went from 13 to 89 comments, and its share rose from 1.6% to 4.4% (+2.8 points). Eager to Buy (66 to 194, +1.3 points) and Waiting for Next Year (10 to 51, +1.3 points) also gained share.\n\nSmall-n spikes: No Face ID (1 to 14) and Reviewer's speaking style criticism (4 to 22) rose sharply, but the counts are too low to read much into.\n\nMost topics grew in raw count, so share change is the better growth signal. This is a comment sample, so it shows associations, not causes.","sql":"WITH base AS (SELECT c.comment_id, c.topic_id, c.day_since_launch AS d FROM comments c JOIN content v ON v.video_id=c.video_id WHERE v.topic='duo' AND v.format!='official' AND c.lang='en' AND c.trivial=0 AND c.topic_id IS NOT NULL), mx AS (SELECT MAX(d) AS m FROM base), agg AS (SELECT topic_id, COUNT(*) AS n_total, SUM(CASE WHEN d>m-7 THEN 1 ELSE 0 END) AS n_this_week, SUM(CASE WHEN d<=m-7 AND d>m-14 THEN 1 ELSE 0 END) AS n_prior_week FROM base, mx GROUP BY topic_id), tot AS (SELECT SUM(n_total) AS t_all, SUM(n_this_week) AS t_this, SUM(n_prior_week) AS t_prior FROM agg) SELECT t.topic_id, t.pool, t.name, t.origin, t.first_seen, a.n_total, ROUND(a.n_total*1.0/tot.t_all,3) AS share_all, a.n_this_week, a.n_prior_week, ROUND(a.n_this_week*1.0/NULLIF(tot.t_this,0),3) AS share_this_week, ROUND(a.n_prior_week*1.0/NULLIF(tot.t_prior,0),3) AS share_prior_week, ROUND(a.n_this_week*1.0/NULLIF(tot.t_this,0) - a.n_prior_week*1.0/NULLIF(tot.t_prior,0),3) AS share_change, ROUND(a.n_this_week*1.0/NULLIF(a.n_prior_week,0)-1,3) AS count_growth FROM agg a JOIN topics t ON t.topic_id=a.topic_id, tot ORDER BY a.n_total DESC LIMIT 40"},{"q":"How does audience sentiment on the iPhone Duo compare with the iPhone 18 Pro?","a":"The iPhone 18 Pro gets somewhat better sentiment overall. Its net is +12 (39% positive, 27% negative, n=3,482), against +5 for the Duo (39% positive, 34% negative, n=7,046). Positive shares are the same, so the gap comes from the Duo's higher negative share.\n\nBy target (Duo vs 18 Pro):\n- Product: +14 (n=4,914) vs +19 (n=2,833)\n- Competitor comparisons: +34 (n=826) vs +44 (n=234)\n- Price/value: -57 (n=738) vs -46 (n=252), so the Duo is worse on price\n- Apple brand: -32 (n=568) vs -64 (n=163), so the 18 Pro is worse here\n\nThe 18 Pro's brand and competitor figures rest on smaller samples (n=163 and n=234), so treat them cautiously. These are YouTube comments, not a representative sample of buyers.","sql":"WITH c AS (SELECT ct.topic, cm.target, cm.sentiment FROM comments cm JOIN content ct ON ct.video_id=cm.video_id WHERE cm.lang='en' AND cm.trivial=0 AND cm.target IN ('product','price_value','apple_brand','competitor') AND ct.format!='official' AND ct.topic IN ('duo','iphone_18_pro')), g AS (SELECT topic, 'all product-side' AS target, sentiment FROM c UNION ALL SELECT topic, target, sentiment FROM c) SELECT topic, target, COUNT(*) AS n_product_side, ROUND(AVG(sentiment='positive'),3) AS pct_positive, ROUND(AVG(sentiment='neutral'),3) AS pct_neutral, ROUND(AVG(sentiment='negative'),3) AS pct_negative, CASE WHEN COUNT(*)>=10 THEN ROUND(AVG(sentiment='positive')-AVG(sentiment='negative'),3) END AS net_sentiment FROM g GROUP BY topic, target ORDER BY target!='all product-side', target, topic LIMIT 40"},{"q":"What do people like most about the Duo, and what do they criticise most?","a":"Buying excitement is the clearest like: the \"Eager to Buy\" topic has a net sentiment of +22 (n=572; 44.8% positive, 22.4% negative). Comparisons with Samsung's folding phones are also favourable at +15 (n=448; 47.3% positive, 32.1% negative).\n\nThe under-display camera draws the sharpest criticism, with a net of -18 (n=302; 23.8% positive, 41.7% negative). Price complaints are slightly negative at -5 (n=479; 35.7% positive, 41.1% negative). Durability doubts are about even at -2 (n=457).\n\nThe biggest topic, \"Samsung Did It First,\" is evenly split at +1 (n=1,061; 39.8% positive, 39.1% negative).\n\nCaveat: these are sampled English comments, and topics can overlap. The scores show the mood in each topic, not necessarily feelings about the phone itself.","sql":"WITH base AS (SELECT c.sentiment, t.name FROM comments c JOIN content v ON v.video_id=c.video_id JOIN topics t ON t.topic_id=c.topic_id WHERE v.topic='duo' AND v.format!='official' AND c.lang='en' AND c.trivial=0 AND c.target IN ('product','price_value','apple_brand','competitor') AND t.pool='product'), agg AS (SELECT name, COUNT(*) AS n, SUM(sentiment='positive') AS n_pos, SUM(sentiment='negative') AS n_neg FROM base GROUP BY name HAVING COUNT(*)>=10), liked AS (SELECT 'most_liked' AS side, name, n, n_pos, n_neg, ROUND(1.0*n_pos/n,3) AS pos_share, ROUND(1.0*n_neg/n,3) AS neg_share FROM agg ORDER BY n_pos DESC LIMIT 8), crit AS (SELECT 'most_criticised' AS side, name, n, n_pos, n_neg, ROUND(1.0*n_pos/n,3) AS pos_share, ROUND(1.0*n_neg/n,3) AS neg_share FROM agg ORDER BY n_neg DESC LIMIT 8) SELECT * FROM liked UNION ALL SELECT * FROM crit"}]};

async function runExplore(){const kw=($("#kw")&&$("#kw").value||"").trim();if(kw.length<2)return;TRY.kw=kw;TRY.push=!!($("#pushchk")&&$("#pushchk").checked);TRY.pushed=false;TRY.run=true;TRY.err="";TRY.msg="";TRY.report=null;TRY.rows=XSTEPS.map(([id,label])=>({id,label,tech:TECH[id],status:"pending"}));render();
 try{await sse("/api/explore",{keyword:kw,push:TRY.push},e=>{if(e.error){TRY.err=e.error}else if(e.done){TRY.report=e.report}else{const r=TRY.rows.find(x=>x.id===e.step);if(r){r.status=e.status==="start"?"run":"done";if(e.detail)r.detail=e.detail;if(e.secs!=null)r.secs=e.secs;if(e.step==="push"&&e.status==="done"&&!/skipped/.test(e.detail||""))TRY.pushed=true}}render()})}

 for(let i=0;i<TRY.rows.length;i++){TRY.rows[i].status="run";render();await new Promise(r=>setTimeout(r,Math.min(1600,Math.max(500,(parseFloat(full[i].secs)||2)*90))));TRY.rows[i].status="done";TRY.rows[i].detail=full[i].detail;TRY.rows[i].secs=full[i].secs;render()}
 TRY.replay=false;render()}

async function runRefresh(){const G=PGROUPS.map(([n,l,sub,re,tech])=>({n,label:`${n}. ${l}`,tech,re,status:"pending",detail:"",secs:0}));let cur=-1;
 const show=(msg)=>{$("#mbox").innerHTML=`<h2 style="margin-top:0">Refreshing now</h2><p class="small mute">Runs the same pipeline as the daily schedule, then pushes the update to email and Slack.</p>${progHtml(G.map(g=>({label:g.label,tech:g.tech,status:g.status,detail:g.detail,secs:g.secs?Math.round(g.secs):""})))}${msg||""}<p style="margin:8px 0 0"><button class="btn" data-act="aboutclose">Close</button></p>`};
 $("#mbox").innerHTML="";show();$("#modal").classList.add("open");
 try{await sse("/api/refresh",{},e=>{if(e.done){G.forEach(g=>{if(g.status==="run")g.status=e.ok?"done":"failed"});show(e.ok?`<p><b>Done.</b> Reloading the dashboard…</p>`:`<p style="color:var(--neg)"><b>The run reported a failure.</b> See the run log.</p>`);if(e.ok)setTimeout(()=>location.reload(),1800);return}
  const gi=G.findIndex(g=>g.re.test(e.step));if(gi<0)return;if(e.status==="start"){for(let k=0;k<gi;k++)if(G[k].status==="run")G[k].status="done";G[gi].status="run";G[gi].detail=e.step;cur=gi}else{G[gi].secs+=parseFloat(e.secs)||0;G[gi].detail=e.step+(e.detail?": "+e.detail:"");if(e.status==="failed")G[gi].status="failed"}show()})}
 catch(err){show(`<p style="color:var(--neg)">${esc(err.message)}</p>`)}}
const PGROUPS=[["1","Refresh source data","YouTube Data API v3",/collect|snapshot|baseline|creator types/i,["YouTube Data API v3","search, videos, channels, commentThreads","daily view snapshots"]],["2","Analyse","Claude API + local NLP",/classify|label|assign comments|build tables|insights/i,["Claude API (Sonnet): comment labels, topic names, narrative","Local NLP: TF-IDF + k-means","Python + SQLite: lift, trends"]],["3","Update reports","Python, SQLite, static HTML",/paraphrased|recorded|text-free|public demo/i,["Claude API: paraphrased notes, Q&A examples","Python: dashboard build, text-free database"]],["4","Push to email and Slack","Resend API, Slack API",/email|slack/i,["Resend API: email report","Slack Incoming Webhook: digest and alerts"]]];
const stepGroups=steps=>PGROUPS.map(([n,l,sub,re])=>{const xs=steps.filter(s=>re.test(s.name));return xs.length?{n,l,sub,xs,secs:sum(xs,s=>s.secs),bad:xs.some(s=>s.status!=="ok")}:null}).filter(Boolean);
function vAuto(){const runs=(D.runs||[]).slice().reverse();
 return`<div class="method" style="margin-bottom:12px"><b>How this runs on its own</b> A scheduled GitHub Actions job runs every day at 15:00 UTC. Most days it is a <b>light check</b>: new videos and comments, topic assignment, new-topic discovery, alerts to Slack only if something fired. On Mondays it is the <b>full report</b>: narrative, paraphrased topic notes, the email and the Slack digest. Each run commits a text-free state folder, so the next one is incremental, and rebuilds this page.</div>
 <div class="card"><h3>Run log</h3><table class="run"><thead><tr><th>Finished</th><th>Mode</th><th>Result</th><th class="num">New videos</th><th class="num">New comments</th><th>New topics</th><th>Sent</th><th>Pipeline</th></tr></thead><tbody>${runs.map(r=>`<tr><td>${esc(fdt(r.finished))}<div class="faint small">${esc(r.source)}</div></td><td>${esc(r.mode)}</td><td style="color:${r.ok?"var(--pos)":"var(--neg)"}">${r.ok?"ok":"failed"}</td><td class="num">${r.new_videos??"–"}</td><td class="num">${r.new_comments!=null?r.new_comments.toLocaleString():"–"}</td><td class="small">${esc((r.new_topics||[]).join(", ")||"–")}</td><td class="small">${[r.email?"email":"",r.slack?"Slack digest":"",r.slack_alerts?"Slack alerts":""].filter(Boolean).join(", ")||"–"}</td><td><div class="steps">${stepGroups(r.steps).map(g=>`<span title="${esc(g.xs.map(s=>s.name+" · "+s.secs+"s"+(s.status==="ok"?"":" · FAILED")).join("\n"))}" style="${g.bad?"border-color:var(--neg);color:var(--neg)":""}"><b>${g.n} ${esc(g.l)}</b> · ${esc(g.sub)} · ${g.xs.length} step${g.xs.length>1?"s":""} · ${g.secs}s</span>`).join("")}</div></td></tr>`).join("")}</tbody></table><p class="small faint" style="margin:8px 0 0">Only runs recorded so far are listed. The first row is a full local run without sending.</p></div>
 <div style="margin-top:12px"><div class="card"><h3>Example weekly email</h3><p class="small mute" style="margin:0 0 8px">Mirrors the dashboard: overview, content performance, audience insights, what changed, watchlist. To show the format; figures are illustrative.</p>${D.email?`<iframe class="mail" sandbox srcdoc="${esc(D.email)}"></iframe>`:`<p class="faint small">Not available.</p>`}</div><div class="card" style="margin-top:12px"><h3>Example Slack digest</h3><p class="small mute" style="margin:0 0 8px">Posted to a channel on the weekly run; alerts post on their own on other days. Mention the app to ask follow-ups.</p>${slackHtml(D.slack)}</div></div>`}

 if(PUB&&!LIVE){const ex=D.examples.find(e=>e.q===q);CHAT.push({r:"u",t:q});CHAT.push({r:"a",t:ex?ex.a:"Not available in the public demo.",sql:ex?ex.sql:null});chatRender();return}

const ABOUT=`<h2 style="margin-top:0">How to read this</h2><p><b>Outperformer</b>: ${GL.outperformer}</p><p><b>Underperformer</b>: ${GL.underperformer}</p><p><b>Lift</b>: ${GL.lift}</p><p><b>Lift and sentiment</b>: they measure different things (reach relative to the channel's usual views, and how commenters feel about the product), so the Content list shows both and lets you sort by either. They are not combined into a recommendation: a video that argues against buying, or is not really about the device, can reach many people while the comments do not read as positive.</p><p><b>Sentiment</b>: ${METH.ps}</p><p><b>Channel size</b>: ${GL.level}</p>
<h3>Limits</h3><ul><li>${D.counts.videos} English-language videos about the iPhone Duo from ${D.counts.creators} channels, found through YouTube searches. A sample of YouTube, not a census. iPhone 18 Pro videos are in the database for comparison questions in chat but not shown here.</li><li>${D.counts.comments_en.toLocaleString()} English comments with signal, up to 40 top and 20 newest per video, labelled by Claude. Top comments lean toward liked opinions.</li><li>Comments were labelled in two modes on different videos (${(D.counts.modes.full||0).toLocaleString()} deeper, ${(D.counts.modes.fast||0).toLocaleString()} faster), so small differences between videos can partly reflect that.</li><li>Region is the channel-declared country. Audience geography is not public.</li><li>Lift compares a video with the same channel's usual videos and with other Duo videos of the same format. Differences between groups are associations, and small groups are flagged.</li>${PUB?"<li>This public demo shows no comment text. Theme notes are paraphrased by Claude from the most-liked comments and checked so they do not reuse a comment's wording, and the chat shows recorded answers. Run the repo locally for quotes and the live chat.</li>":""}<li>Sponsorship and Apple seeding are not analysed: no sponsor in this data was Apple or a competitor, and seeding could not be verified from public data.</li></ul><p><button class="btn" data-act="aboutclose">Close</button></p>`;
