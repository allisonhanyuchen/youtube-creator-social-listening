<div class="wrap"><header><div><h1>YouTube Creator Social Listening</h1><p class="sub" id="sub"></p><p class="sub" id="pubnote" style="display:none;color:var(--warn)"></p></div><div class="row"><button class="btn" data-act="about">How to read this</button></div></header><nav id="tabs"></nav><main id="view"></main></div>

<script>
const D=__DATA__;
const PUB=!!D.public,NOQ=PUB?"Comment quotes are not included in the public demo.":"No saved quotes for this group.";
const V=D.videos,C=D.creators;V.forEach((v,i)=>{v.i=i;v.cr_=C[v.c]});
const LBL={f:{first_impressions:"First impressions",full_review:"Full review",comparison:"Comparison",upgrade_advice:"Upgrade advice",keynote_recap:"Keynote recap",durability_test:"Durability test",explainer_tips:"Explainer / tips",rumor_leak:"Rumor / leak",meme_short:"Meme / reaction",other:"Other"},
 kol:{pro_reviewer:"Pro reviewer",apple_focused:"Apple-focused",lifestyle_vlogger:"Lifestyle / vlogger",tech_news_media:"News / media",commentary_analyst:"Commentary",entertainment_shorts:"Entertainment / Shorts",other:"Other"},
 th:{hype_purchase_excitement:"Hype and purchase intent",fold_animation_ui:"Fold animation and UI",price_affordability:"Price",android_prior_art:"Android did it first",android_rival_comparison:"Competitor comparison",design_colors_form:"Design and colours",crease_screen_quality:"Crease and screen",camera_hardware:"Camera",durability_tests:"Durability",software_usability:"Software and usability",apple_brand_leadership:"Apple brand and leadership",creator_credibility_critique:"Ad-like or biased creator"}};
const TIERS=["nano <50k","micro 50-250k","mid 250k-1M","macro 1-5M","mega 5M+"],REGIONS=["US","GB","CA","IN","AU","Other / undeclared"];
const regionOf=v=>["US","GB","CA","IN","AU"].includes(v.cr_.region)?v.cr_.region:"Other / undeclared";
const sz=v=>["nano <50k","micro 50-250k"].includes(v.cr_.tier)?"small":v.cr_.tier==="mid 250k-1M"?"mid":"large";
const METH={ps:"Share of comments about the product, price, Apple or competitors. Claude labels each comment's sentiment toward what it is about; comments about the video or the creator are left out.",
 theme:"Comments tagged with this theme (one comment can carry several). Claude labels each comment's sentiment toward what it is about.",
 topic:"Comments grouped by local keyword clustering. Each comment keeps the sentiment Claude labelled it with, so these shares are counted, not judged again."};
const GL={small:"Small channels: under 250k subscribers.",mid:"Mid-size channels: 250k to 1M subscribers.",large:"Large channels: 1M+ subscribers.",
 outperformer:"Views in the top quarter relative to the channel's own usual views, compared within Shorts or within long videos, already adjusted for the launch-week boost.",
 underperformer:"Views in the bottom quarter relative to the channel's own usual views, within Shorts or long videos.",
 lift:"Views vs the channel's usual views on comparable pre-launch videos, divided by the typical value for the same format. 1.0x is a typical video, 2x is twice as strong.",
 eng:"Likes plus comments on the videos in view.",engrate:"Likes plus comments divided by views, across the videos in view.",views:"Total views on the videos in view.",creators:"Distinct channels with at least one video in view.",vids:"Number of videos in view.",
 sent:METH.ps,n:"Sample size. Groups with fewer than 10 are flagged because their rates can swing a lot.",
 level:"Channel size by subscribers: nano <50k, micro 50-250k, mid 250k-1M, macro 1-5M, mega 5M+.",
 heat:"Number = videos (the last row and column are totals). Shading = share of outperformers, shown when a cell has at least 5 videos. Click a cell, row or column to filter the page.",
 sort:"Click a column header to sort. Sentiment sorts by positive minus negative share.",
 map:"Right = mentioned more. Up = more positive than negative. Solid bubbles are the 12 themes Claude tagged comments with; dashed bubbles are topics found by local clustering. Click one to read about it.",
 competitors:"Comments that name a competitor brand. Sentiment is of those comments toward whatever they are about.",
 beyond:"Topics found by keyword statistics (TF-IDF and clustering), not by AI. New = none of the 12 themes names it. Refines = a more specific slice of an existing theme."};
const info=k=>`<i class="info" data-g="${k}">i</i>`;
const defaults=()=>({tab:"overview",kol:Object.keys(LBL.kol),tier:TIERS.slice(),region:REGIONS.slice(),format:Object.keys(LBL.f),atype:"all",fexp:null,kexp:null,sort:{k:"lift",d:-1},theme:null,etopic:null,more:{},open:null});
let S=defaults(),CHAT=[];
try{const h=location.hash.slice(1);if(h)S=Object.assign(defaults(),JSON.parse(decodeURIComponent(h)))}catch(e){}
const save=()=>{try{history.replaceState(null,"","#"+encodeURIComponent(JSON.stringify(S)))}catch(e){}};
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const sum=(a,f)=>a.reduce((s,x)=>s+f(x),0),med=a=>{a=a.filter(x=>x!=null).sort((x,y)=>x-y);if(!a.length)return null;const m=a.length>>1;return a.length%2?a[m]:(a[m-1]+a[m])/2};
const pct=(x,d=0)=>x==null?"–":(x*100).toFixed(d)+"%",num=x=>x==null?"–":x>=1e9?(x/1e9).toFixed(1)+"B":x>=1e6?(x/1e6).toFixed(1)+"M":x>=1e3?(x/1e3).toFixed(0)+"k":String(Math.round(x));
const nTag=n=>`<span class="n ${n<10?"low":""}" data-g="n">n=${n.toLocaleString()}${n<10?" low":""}</span>`;
const SLICE=[["kol","Creator type",v=>v.cr_.kol,LBL.kol],["tier","Level",v=>v.cr_.tier,null],["region","Region",regionOf,null],["format","Content type",v=>v.f,LBL.f]];
const allOf=k=>k==="kol"?Object.keys(LBL.kol):k==="tier"?TIERS.slice():k==="region"?REGIONS.slice():Object.keys(LBL.f);
function base(over={}){const st=Object.assign({},S,over);return V.filter(v=>SLICE.every(([k,,get])=>st[k].includes(get(v))))}
const nps=v=>v.a.ps[0]+v.a.ps[1]+v.a.ps[2],posOf=v=>nps(v)?v.a.ps[0]/nps(v):null,negOf=v=>nps(v)?v.a.ps[2]/nps(v):null,netOf=v=>nps(v)?(v.a.ps[0]-v.a.ps[2])/nps(v):null;
const PCT_=[V.filter(v=>!v.sh&&v.rl!=null).map(v=>v.rl).sort((a,b)=>a-b),V.filter(v=>v.sh&&v.rl!=null).map(v=>v.rl).sort((a,b)=>a-b)];
function PCT(v){const a=PCT_[+!!v.sh];if(v.rl==null)return null;let lo=0,hi=a.length;while(lo<hi){const mid=(lo+hi)>>1;a[mid]<v.rl?lo=mid+1:hi=mid}return lo/Math.max(a.length-1,1)}
function stats(vs){const ev=vs.filter(v=>v.op!=null),k=sum(ev,v=>v.op),u=sum(ev,v=>v.un||0),ps=[0,1,2].map(i=>sum(vs,v=>v.a.ps[i])),np=ps[0]+ps[1]+ps[2],views=sum(vs,v=>v.vw),eng=sum(vs,v=>v.lk+v.cc);
 return{n:vs.length,nev:ev.length,k,u,rate:ev.length?k/ev.length:null,urate:ev.length?u/ev.length:null,views,eng,engrate:views?eng/views:null,ps,np,creators:new Set(vs.map(v=>v.c)).size}}
/* sentiment bar: positive / neutral / negative in one bar, with the exact shares and the method on hover */
function sbar(c,method){const n=c[0]+c[1]+c[2];if(!n)return`<span class="faint small">no labelled comments</span>`;
 const tip=`Positive ${pct(c[0]/n)} · Neutral ${pct(c[1]/n)} · Negative ${pct(c[2]/n)} (n=${n.toLocaleString()}). ${method||METH.ps}`;
 return`<div class="sbar" data-tip="${esc(tip)}"><i class="p" style="width:${c[0]/n*100}%"></i><i class="u" style="width:${c[1]/n*100}%"></i><i class="g" style="width:${c[2]/n*100}%"></i></div>`}
const vidLink=v=>`<a href="${v.url}" target="_blank" rel="noopener" onclick="event.stopPropagation()">${esc(v.t)}</a>`;
const timing=v=>v.d<=0?"posted launch day":v.d===1?"posted day after launch":v.d<=3?"posted in launch week":`posted D+${v.d}`;
const themeCounts=v=>Object.entries(v.a.th).map(([t,c])=>({k:D.themes[t][0],p:c[0],u:c[1],g:c[2]}));
function detail(v){const tc=themeCounts(v),top=key=>tc.filter(x=>x[key]>=2).sort((a,b)=>b[key]-a[key]).slice(0,3).map(x=>`${LBL.th[x.k]} (${x[key]})`).join(", ")||"none stand out";
 return`<div class="small"><b>${esc(v.cr_.name)}</b> · ${esc(v.cr_.tier)} · ${esc(LBL.f[v.f])} · ${timing(v)}<br>Views <b>${num(v.vw)}</b>${v.bv?` vs about <b>${num(v.bv)}</b> usual for this channel (${(v.vw/v.bv).toFixed(1)}x). Relative lift <b>${v.rl==null?"–":v.rl.toFixed(2)+"x"}</b>`:""}</div>
 <div class="small" style="margin-top:6px"><b style="color:var(--pos)">Praised:</b> ${top("p")}<br><b style="color:var(--neg)">Criticised:</b> ${top("g")}</div>${v.a.tc.map(c=>`<div class="q ${c[1]===0?"p":c[1]===2?"g":""}">${esc(c[0])}<small>${c[3]} likes</small></div>`).join("")}`}
function csv(name,rows){const q=x=>`"${String(x??"").replace(/"/g,'""')}"`;const b=new Blob([rows.map(r=>r.map(q).join(",")).join("\n")],{type:"text/csv"});const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=name;a.click()}
function sliceChips(){const out=[];SLICE.forEach(([k,l,,map])=>{if(S[k].length!==allOf(k).length)out.push(`<span class="chip" data-unslice="${k}">${l}: ${esc(S[k].map(x=>map?map[x]:x).join(", ")||"none")}</span>`)});return out.length?`<div class="chips">${out.join("")}<a href="#" class="small" data-act="reset">Clear</a></div>`:`<div class="chips"></div>`}
/* ---------- Overview ---------- */
function heat(vs,rowKeys,rowLbl,rowGet,colKeys,colLbl,colGet,rowSlice,colSlice){
 const cell=(r,c)=>{const x=vs.filter(v=>rowGet(v)===r&&colGet(v)===c),t=stats(x),sel=S[rowSlice].length===1&&S[rowSlice][0]===r&&S[colSlice].length===1&&S[colSlice][0]===c;if(!t.n)return`<td class="cell faint" data-cell="${rowSlice}|${r}|${colSlice}|${esc(c)}">·</td>`;const a=t.nev>=5?Math.min(.85,t.rate*1.8):0;return`<td class="cell ${sel?"sel":""}" data-cell="${rowSlice}|${r}|${colSlice}|${esc(c)}" data-tip="${esc(rowLbl(r))} · ${esc(colLbl(c))}: ${t.n} videos, ${pct(t.rate)} outperformers (n=${t.nev})" style="background:${a?`color-mix(in srgb,var(--accent) ${a*100}%,transparent)`:"var(--bg)"}">${t.n}</td>`};
 const rowTot=r=>vs.filter(v=>rowGet(v)===r).length,colTot=c=>vs.filter(v=>colGet(v)===c).length;
 return`<table class="heat"><thead><tr><th></th>${colKeys.map(c=>`<th class="cl" data-col="${colSlice}|${esc(c)}">${esc(colLbl(c))}</th>`).join("")}<th class="tt">Total</th></tr></thead><tbody>${rowKeys.map(r=>`<tr><td class="rl" data-row="${rowSlice}|${r}">${esc(rowLbl(r))}</td>${colKeys.map(c=>cell(r,c)).join("")}<td class="tt" data-tip="${esc(rowLbl(r))}: ${rowTot(r)} videos in total">${rowTot(r)}</td></tr>`).join("")}<tr><td class="rl tt">Total</td>${colKeys.map(c=>`<td class="tt">${colTot(c)}</td>`).join("")}<td class="tt">${vs.length}</td></tr></tbody></table>`}
function videoList(vs,id){const lim=S.more[id]?30:8,rows=vs.slice().sort((a,b)=>b.vw-a.vw),short=r=>r==="Other / undeclared"?"Other":r;
 return`<table><thead><tr><th>Video</th><th>Creator</th><th>Region</th><th>Level</th><th class="num">Views ${info("views")}</th><th class="num">Engagement % ${info("engrate")}</th><th>Lift ${info("lift")}</th><th>Sentiment ${info("sent")}</th></tr></thead><tbody>${rows.slice(0,lim).map(v=>`<tr><td style="max-width:300px">${vidLink(v)}</td><td>${esc(v.cr_.name)}</td><td>${esc(short(regionOf(v)))}</td><td>${esc(v.cr_.tier)}</td><td class="num">${num(v.vw)}</td><td class="num">${pct(v.er,2)}</td><td>${v.rl==null?"–":v.rl.toFixed(2)+"x"}</td><td style="min-width:120px">${sbar(v.a.ps)}</td></tr>`).join("")}</tbody></table>${rows.length>8?`<p style="margin:6px 0 0"><button class="btn" data-act="more:${id}">${S.more[id]?"Show fewer":"Show more ("+Math.min(30,rows.length)+")"}</button> <span class="small faint">${rows.length} videos</span></p>`:""}`}
function vOverview(){const vs=base(),s=stats(vs),short=t=>t.replace(/ \d.*$/,"").replace("Other / undeclared","Other"),kols=Object.keys(LBL.kol),kl=k=>LBL.kol[k];
 const fs=Object.keys(LBL.f).map(f=>Object.assign({f},stats(vs.filter(v=>v.f===f)))).filter(r=>r.n).sort((a,b)=>b.n-a.n);
 const fmtRows=fs.map(r=>`<tr class="click ${S.fexp===r.f?"sel":""}" data-fexp="${r.f}"><td><b>${S.fexp===r.f?"▾":"▸"} ${LBL.f[r.f]}</b></td><td class="num">${r.n}</td><td class="num">${num(r.views)}</td><td class="num">${num(r.eng)}</td><td class="num">${pct(r.engrate,2)}</td><td style="min-width:150px">${sbar(r.ps)}</td></tr>`+(S.fexp===r.f?`<tr class="det"><td colspan="6">${videoList(vs.filter(v=>v.f===r.f),"f")}</td></tr>`:"")).join("");
 const T=stats(vs);
 return sliceChips()+`<div class="grid g6"><div class="card kpi"><div class="v">${s.creators}</div><div class="l">Creators ${info("creators")}</div></div><div class="card kpi"><div class="v">${s.n}</div><div class="l">Content</div></div><div class="card kpi"><div class="v">${num(s.views)}</div><div class="l">Views ${info("views")}</div></div><div class="card kpi"><div class="v">${num(s.eng)}</div><div class="l">Engagements ${info("eng")}</div></div>

  else if(a==="csv"){const vs=sorted(base());csv("content_list.csv",[["video","url","creator","region","level","content type","lift","views","engagement rate","positive","negative","product comments"]].concat(vs.map(x=>[x.t,x.url,x.cr_.name,regionOf(x),x.cr_.tier,LBL.f[x.f],x.rl==null?"":x.rl.toFixed(2),x.vw,x.er.toFixed(4),nps(x)?posOf(x).toFixed(2):"",nps(x)?negOf(x).toFixed(2):"",nps(x)])))}}});
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.id==="askin")doAsk();if(e.key==="Escape")$("#modal").classList.remove("open")});
$("#modal").addEventListener("click",e=>{if(e.target.id==="modal")e.target.classList.remove("open")});
render();
</script></body></html>
