<script>
const D=__DATA__;
let LIVE=false;const PUB=!!D.public,NOQ=PUB?"Comment quotes are not included in the public demo.":"No saved quotes for this group.";
const V=D.videos,C=D.creators;V.forEach((v,i)=>{v.i=i;v.cr_=C[v.c]});
const LBL={f:{first_impressions:"First impressions",full_review:"Full review",comparison:"Comparison",upgrade_advice:"Upgrade advice",keynote_recap:"Keynote recap",durability_test:"Durability test",explainer_tips:"Explainer / tips",rumor_leak:"Rumor / leak",meme_short:"Meme / reaction",other:"Other"},
 kol:{pro_reviewer:"Pro reviewer",apple_focused:"Apple-focused",lifestyle_vlogger:"Lifestyle / vlogger",tech_news_media:"News / media",commentary_analyst:"Commentary",entertainment_shorts:"Entertainment / Shorts",other:"Other"}};

const TIERS=["nano <50k","micro 50-250k","mid 250k-1M","macro 1-5M","mega 5M+"],REGIONS=["US","GB","CA","IN","AU","Other / undeclared"];
const regionOf=v=>["US","GB","CA","IN","AU"].includes(v.cr_.region)?v.cr_.region:"Other / undeclared";
const sz=v=>["nano <50k","micro 50-250k"].includes(v.cr_.tier)?"small":v.cr_.tier==="mid 250k-1M"?"mid":"large";
const METH={ps:"How positively or negatively does the audience talk about the product? The share of comments about the product, price, Apple or competitors that are positive, neutral or negative. Claude labels each comment's sentiment toward what it is about; comments about the video or the creator are left out. The score next to each bar is positive % minus negative %, from -100 to +100.",
 topic:"What is the audience talking about, and how do they feel about it? Comments are grouped into this topic by local keyword clustering (one topic per comment). Each keeps the sentiment Claude labelled it with, so the shares are counted, not judged again."};
const GL={small:"Small channels: under 250k subscribers.",mid:"Mid-size channels: 250k to 1M subscribers.",large:"Large channels: 1M+ subscribers.",
 outperformer:"Which videos got more views than their channel usually gets? Views in the top quarter relative to the channel's own usual views, compared within Shorts or within long videos, adjusted for the launch-week boost.",
 underperformer:"Which videos got fewer views than their channel usually gets? Views in the bottom quarter relative to the channel's own usual views, within Shorts or long videos.",
 lift:"How much more (or less) reach did this video get than is normal for this creator? Views divided by the channel's usual views on comparable pre-launch videos, then divided by the typical value for the same format. 1.0x is a typical video, 2x is twice as strong.",
 eng:"How much did people interact with these videos? Likes plus comments.",engrate:"How strongly does the audience react per view? Likes plus comments divided by views, across the videos in view.",d1:"Is this video still gaining views? Views added in the last 24 hours, from our own daily snapshots (the YouTube API only gives the current count). Shows a dash until two daily snapshots exist.",d7:"Is this video still gaining views over a longer window? Views added over the last 7 days, from our own daily snapshots. Shows a dash until a week of snapshots exists.",
 views:"How many people did these videos reach? Total views on the videos in view.",creators:"How many different channels are covered? Distinct channels with at least one video in view.",vids:"How many videos are in view? Count of videos after the current filters.",
 sent:METH.ps,n:"How reliable is this number? The sample size. Groups with fewer than 10 are flagged because their rates can swing a lot.",
 level:"How big is the channel? Subscriber bands: nano <50k, micro 50-250k, mid 250k-1M, macro 1-5M, mega 5M+.",
 heat:"Where do the videos, and the outperformers, sit? The number is videos (last row and column are totals). Shading is the share of outperformers, shown when a cell has at least 5 videos. Click a cell, a total or a header to filter the page.",
 map:"Which topics matter most, and which are heating up? Each bubble is a topic: size = number of comments, right = higher share of positive comments, up = more attention lately (trend, 1.0x = its usual share of comments). Click one to read about it.",
 trend:"Is this topic getting more attention lately? Share of the topic's comments posted in the last 7 days, relative to the usual share across all topics. 1.0x is usual; above 1.5x with at least 15 recent comments is marked gaining.",
 sort:"How do I rank the videos? Click a column header to sort. Sentiment can sort by positive share, negative share or net (positive minus negative).",
 competitors:"How do people talk about competitors? Comments that name a competitor brand; the sentiment is toward whatever each comment is about.",
};GL.rivals=GL.competitors;
const info=k=>`<i class="info" data-g="${k}">i</i>`;
const defaults=()=>({tab:"overview",kol:Object.keys(LBL.kol),tier:TIERS.slice(),region:REGIONS.slice(),format:Object.keys(LBL.f),q:"",fexp:null,kexp:null,ts:{},etopic:null,more:{},open:null});
let S=defaults(),CHAT=[];
try{const h=decodeURIComponent(location.hash.slice(1));if(/^[a-z]+$/.test(h))S.tab=h;else if(h)S=Object.assign(defaults(),JSON.parse(h))}catch(e){}
/* the address only carries what differs from the defaults: nothing for the first view, "#audience" for a plain tab, a short JSON when filters are set */
const save=()=>{try{const d=defaults(),diff={};Object.keys(S).forEach(k=>{if(JSON.stringify(S[k])!==JSON.stringify(d[k]))diff[k]=S[k]});const ks=Object.keys(diff);
 const h=!ks.length?"":ks.length===1&&ks[0]==="tab"?diff.tab:encodeURIComponent(JSON.stringify(diff));history.replaceState(null,"",location.pathname+location.search+(h?"#"+h:""))}catch(e){}};
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const sum=(a,f)=>a.reduce((s,x)=>s+f(x),0),med=a=>{a=a.filter(x=>x!=null).sort((x,y)=>x-y);if(!a.length)return null;const m=a.length>>1;return a.length%2?a[m]:(a[m-1]+a[m])/2};
const pct=(x,d=0)=>x==null?"–":(x*100).toFixed(d)+"%",num=x=>x==null?"–":x>=1e9?(x/1e9).toFixed(1)+"B":x>=1e6?(x/1e6).toFixed(1)+"M":x>=1e3?(x/1e3).toFixed(0)+"k":String(Math.round(x));
const nTag=n=>`<span class="n ${n<10?"low":""}" data-g="n">n=${n.toLocaleString()}${n<10?" low":""}</span>`;
const SLICE=[["kol","Creator type",v=>v.cr_.kol,LBL.kol],["tier","Level",v=>v.cr_.tier,null],["region","Region",regionOf,null],["format","Content type",v=>v.f,LBL.f]];
const allOf=k=>k==="kol"?Object.keys(LBL.kol):k==="tier"?TIERS.slice():k==="region"?REGIONS.slice():Object.keys(LBL.f);
function base(over={}){const st=Object.assign({},S,over);return V.filter(v=>SLICE.every(([k,,get])=>st[k].includes(get(v))))}
const nps=v=>v.a.ps[0]+v.a.ps[1]+v.a.ps[2],posOf=v=>nps(v)?v.a.ps[0]/nps(v):null,negOf=v=>nps(v)?v.a.ps[2]/nps(v):null,netOf=v=>nps(v)?(v.a.ps[0]-v.a.ps[2])/nps(v):null;
const PCT_=[V.filter(v=>!v.sh&&v.rl!=null).map(v=>v.rl).sort((a,b)=>a-b),V.filter(v=>v.sh&&v.rl!=null).map(v=>v.rl).sort((a,b)=>a-b)];
function PCT(v){const a=PCT_[+!!v.sh];if(v.rl==null)return null;let lo=0,hi=a.length;while(lo<hi){const mid=(lo+hi)>>1;a[mid]<v.rl?lo=mid+1:hi=mid}return lo/Math.max(a.length-1,1)}
function stats(vs){const ev=vs.filter(v=>v.op!=null),k=sum(ev,v=>v.op),u=sum(ev,v=>v.un||0),ps=[0,1,2].map(i=>sum(vs,v=>v.a.ps[i])),np=ps[0]+ps[1]+ps[2],views=sum(vs,v=>v.vw),eng=sum(vs,v=>v.lk+v.cc);
 return{n:vs.length,nev:ev.length,k,u,rate:ev.length?k/ev.length:null,urate:ev.length?u/ev.length:null,views,eng,engrate:views?eng/views:null,ps,np,creators:new Set(vs.map(v=>v.c)).size}}
/* sentiment bar: positive / neutral / negative in one bar, with the exact shares and the method on hover */
function sbar(c,method){const n=c[0]+c[1]+c[2];if(!n)return`<span class="faint small">no labelled comments</span>`;
 const sc=Math.round((c[0]-c[2])/n*100),tip=`Sentiment score ${sc>0?"+":""}${sc} (positive % minus negative %, from -100 to +100). Positive ${pct(c[0]/n)} · Neutral ${pct(c[1]/n)} · Negative ${pct(c[2]/n)} (n=${n.toLocaleString()}). ${method||METH.ps}`;

document.addEventListener("click",e=>{const t=e.target,c=s=>t.closest&&t.closest(s);let h;
 if(c(".info"))return;
 if(POP&&!c(".dd")){POP=null;render()}
 if(HM&&!c(".hm")){HM=null;render()}
 if(h=c("[data-dd]")){POP=POP===h.dataset.dd?null:h.dataset.dd;render()}
 else if(h=c("[data-all]")){e.preventDefault();const[k,v]=h.dataset.all.split(":");S[k]=v==="1"?allOf(k):[];render()}
 else if(h=c("[data-tab]")){POP=null;S.tab=h.dataset.tab;S.open=null;render()}
 else if(h=c("[data-unslice]")){S[h.dataset.unslice]=allOf(h.dataset.unslice);render()}
 else if(h=c("[data-cell]")){const[rk,r,ck,cv]=h.dataset.cell.split("|");if(same(S[rk],[r])&&same(S[ck],[cv])){S[rk]=allOf(rk);S[ck]=allOf(ck)}else{S[rk]=[r];S[ck]=[cv]}render()}
 else if(h=c("[data-row]")){const[k,r]=h.dataset.row.split("|");S.kexp=S.kexp===r?null:r;render()}
 else if(h=c("[data-col]")){const[k,r]=h.dataset.col.split("|");S[k]=same(S[k],[r])?allOf(k):[r];render()}
 else if(h=c("[data-fsel]")){const f=h.dataset.fsel;S.format=f==="*"||same(S.format,[f])?allOf("format"):[f];render()}
 else if(h=c("[data-hm]")){HM=HM===h.dataset.hm?null:h.dataset.hm;render()}
 else if(h=c("[data-ts]")){e.preventDefault();const[id,k,d]=h.dataset.ts.split("|");if(d==="0")delete S.ts[id];else S.ts[id]={k,d:+d};HM=null;render()}
 else if(h=c("[data-totall]")){const[a,b]=h.dataset.totall.split("|");S[a]=allOf(a);S[b]=allOf(b);render()}
 else if(h=c("[data-tot]")){const[k,v]=h.dataset.tot.split("|");S[k]=same(S[k],[v])?allOf(k):[v];render()}
 else if(h=c("[data-etopic]")){const fromMap=!!c(".tmap,.tl");S.etopic=S.etopic===h.dataset.etopic?null:h.dataset.etopic;render();if(fromMap&&S.etopic){const r=document.querySelector("tr.det");r&&r.scrollIntoView({block:"center",behavior:"smooth"})}}
 else if(h=c("[data-open]")){S.open=S.open===h.dataset.open?null:h.dataset.open;render();if(S.open&&h.tagName==="circle"){const r=document.querySelector(".det");r&&r.scrollIntoView({block:"center",behavior:"smooth"})}}
 else if(h=c("[data-sug]")){doAsk(h.dataset.sug)}
 else if(h=c("[data-act]")){const[a,v]=h.dataset.act.split(":");
  if(a==="reset"){e.preventDefault();const t0=S.tab;S=defaults();S.tab=t0;POP=null;render()}
  else if(a==="more"){S.more[v]=!S.more[v];render()}else if(a==="about"){$("#mbox").innerHTML=ABOUT;$("#modal").classList.add("open")}else if(a==="aboutclose"){$("#modal").classList.remove("open")}
  else if(a==="chat"){$("#chat").classList.add("open");$("#chatbtn").style.visibility="hidden";chatRender();$("#askin").focus()}else if(a==="chatclose"){$("#chat").classList.remove("open");$("#chatbtn").style.visibility="visible"}else if(a==="ask"){doAsk()}
  else if(a==="csv"){const vs=sorted(base());csv("content_list.csv",[["video","url","creator","region","level","content type","lift","views","views gained 24h","views gained 7d","engagement rate","positive","negative","product comments"]].concat(vs.map(x=>[x.t,x.url,x.cr_.name,regionOf(x),x.cr_.tier,LBL.f[x.f],x.rl==null?"":x.rl.toFixed(2),x.vw,x.d1??"",x.d7??"",x.er.toFixed(4),nps(x)?posOf(x).toFixed(2):"",nps(x)?negOf(x).toFixed(2):"",nps(x)])))}}});
document.addEventListener("change",e=>{const k=e.target.dataset&&e.target.dataset.chk;if(k){const[g,v]=k.split(/:(.*)/s),a=S[g],i=a.indexOf(v);i>=0?a.splice(i,1):a.push(v);render()}});
document.addEventListener("input",e=>{if(e.target.id==="qin"){const p=e.target.selectionStart;S.q=e.target.value;render();const i=$("#qin");if(i){i.focus();i.setSelectionRange(p,p)}}});
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.id==="askin")doAsk();if(e.key==="Escape")$("#modal").classList.remove("open")});
$("#modal").addEventListener("click",e=>{if(e.target.id==="modal")e.target.classList.remove("open")});
notes();render();
</script></body></html>
