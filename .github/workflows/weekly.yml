name: Weekly launch readout

on:
  schedule:
    - cron: "0 15 * * *"        # every day 15:00 UTC; run_weekly.py does the light pass, and the full pass on Mondays
  workflow_dispatch:
    inputs:
      send:
        description: "Send the email and Slack digest"
        type: boolean
        default: true

permissions:
  contents: write                # commits the text-free state/ folder and the public demo page back

concurrency:
  group: weekly-readout
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run the weekly pipeline
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          REPORT_EMAIL_TO: ${{ secrets.REPORT_EMAIL_TO }}
        run: |
          ARGS=""
          if [ "${{ github.event.inputs.send }}" = "false" ]; then ARGS="--no-send"; fi
          python run_weekly.py $ARGS
      - name: Commit updated state
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state docs api
          git diff --cached --quiet || (git commit -m "Scheduled state update" && git push)
